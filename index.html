<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F5F2EA">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BP Financeiro">
<title>BP Financeiro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
:root{--paper:#F5F2EA;--paper2:#EDE9DE;--white:#FBF9F4;--ink:#0F1922;--gold:#8F7318;
--gold-l:#B69540;--navy:#16283C;--gray:#6E7681;--line:#DCD6C7;--green:#2F6B4F;--red:#9E3B2E;
--navbg:rgba(245,242,234,.97);--glass:rgba(251,250,246,.74);--glassline:rgba(255,255,255,.7);--glasshi:rgba(255,255,255,.85);--lens:rgba(255,255,255,.7);--sheetbg:rgba(15,25,34,.55);--inputbg:#FBF9F4;--p1:#16283C;--p2:#2F6B4F;--p3:#8F7318;--p4:#A5552F;}
html[data-t="dark"]{--paper:#0B1218;--paper2:#16222C;--white:#131D26;--ink:#F0EEE8;
--gold:#B69540;--gold-l:#C9AC63;--navy:#20344A;--gray:#8C98A2;--line:#26363F;
--green:#6EC896;--red:#DC6E5F;--navbg:rgba(11,18,24,.97);--glass:rgba(22,34,44,.72);--glassline:rgba(255,255,255,.12);--glasshi:rgba(255,255,255,.14);--lens:rgba(255,255,255,.12);--sheetbg:rgba(0,0,0,.66);--inputbg:#16222C;--p1:#7E9CC0;--p2:#6EC896;--p3:#C9A43B;--p4:#DB8B5E;}
html{background:var(--paper);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;transition:background .2s,color .2s;
padding-bottom:calc(104px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;
overscroll-behavior-y:contain;}
.app{max-width:560px;margin:0 auto;}
header{padding:calc(22px + env(safe-area-inset-top)) 20px 14px;}
.tt{width:52px;height:28px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);
position:relative;cursor:pointer;flex:0 0 auto;padding:0;touch-action:manipulation;}
.tt i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
background:var(--gold);transition:transform .22s;display:flex;align-items:center;justify-content:center;}
html[data-t="dark"] .tt i{transform:translateX(24px);}
.tt svg{width:13px;height:13px;fill:none;stroke:var(--paper);stroke-width:2.2;stroke-linecap:round;}
h1{font-family:'Playfair Display';font-weight:400;font-size:29px;line-height:1.06;margin-top:9px;}
h1 em{font-style:italic;color:var(--gold);}
main{padding:16px 20px;}
.lab{font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.15em;color:var(--gray);
text-transform:uppercase;margin:22px 0 9px;display:flex;justify-content:space-between;align-items:center;}
.lab:first-child{margin-top:0;}
.card{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:10px;}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:14px;min-width:0;}
.kpi .k{font-family:'JetBrains Mono';font-size:8px;letter-spacing:.11em;color:var(--gray);text-transform:uppercase;line-height:1.3;}
.kpi .v{font-family:'Playfair Display';font-size:clamp(19px,6vw,25px);margin-top:6px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .v.g{color:var(--gold);}.kpi .v.gr{color:var(--green);}.kpi .v.rd{color:var(--red);}
.kpi .s{font-size:11px;color:var(--gray);margin-top:5px;line-height:1.3;}
.tr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.tr:last-of-type{border-bottom:none;}
.tr .nm{flex:1;min-width:0;}
.tr .t1{font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;}
.tr .t2{font-family:'JetBrains Mono';font-size:10px;color:var(--gray);margin-top:3px;line-height:1.3;}
.tr .vl{font-family:'JetBrains Mono';font-size:14px;font-weight:700;text-align:right;white-space:nowrap;flex:0 0 auto;}
.tr .dt{font-family:'JetBrains Mono';font-size:11px;color:var(--gray);width:26px;flex:0 0 auto;text-align:center;}
.tot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 2px;
border-top:2px solid var(--ink);margin-top:4px;}
.tot .l{font-weight:700;font-size:14px;}
.tot .v{font-family:'JetBrains Mono';font-weight:700;font-size:16px;white-space:nowrap;}
.st{font-family:'JetBrains Mono';font-size:8.5px;font-weight:700;letter-spacing:.06em;
padding:6px 10px;border-radius:99px;flex:0 0 auto;cursor:pointer;border:none;min-height:30px;}
.st.ok{background:rgba(47,107,79,.12);color:var(--green);}
.st.no{background:rgba(158,59,46,.1);color:var(--red);}
.st.pa{background:rgba(143,115,24,.13);color:var(--gold);}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
.trio .b{background:var(--paper2);border-radius:4px;padding:12px 10px;min-width:0;}
.trio .k{font-family:'JetBrains Mono';font-size:7.5px;letter-spacing:.1em;color:var(--gray);text-transform:uppercase;line-height:1.3;}
.trio .v{font-family:'Playfair Display';font-size:clamp(14px,4.3vw,19px);margin-top:5px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.note{background:var(--paper2);border-left:3px solid var(--gold);border-radius:4px;
padding:13px 14px;font-size:12.5px;color:var(--gray);line-height:1.55;margin-top:12px;}
.note b{color:var(--ink);}
.mrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:6px;align-items:center;
padding:9px 0;border-bottom:1px solid var(--line);}
.mrow:last-of-type{border-bottom:none;}
.mrow .m{font-family:'JetBrains Mono';font-size:11px;font-weight:700;}
.mrow input{width:100%;background:transparent;border:none;border-bottom:1px dashed var(--line);
font-family:'JetBrains Mono';font-size:12px;text-align:right;color:var(--ink);
padding:5px 2px;outline:none;min-height:32px;-webkit-appearance:none;}
.mrow input:focus{border-bottom-color:var(--gold);background:rgba(143,115,24,.05);}
.mrow .n{font-family:'JetBrains Mono';font-size:12px;text-align:right;}
.mrow .n.g{color:var(--gold);font-weight:700;}
.bar{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.bar:last-child{border-bottom:none;}
.bar .a{font-family:'JetBrains Mono';font-size:11px;width:74px;flex:0 0 auto;}
.bar .t{flex:1;height:9px;background:var(--paper2);border-radius:99px;overflow:hidden;}
.bar .f{height:100%;background:var(--navy);border-radius:99px;}
.bar.on .f{background:var(--gold);}
.bar.on .a,.bar.on .r{color:var(--gold);font-weight:700;}
.bar .r{font-family:'JetBrains Mono';font-size:11px;width:66px;text-align:right;flex:0 0 auto;}
.goal{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--gold);
border-radius:4px;padding:15px;margin-bottom:10px;}
.goal .h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.goal .n{font-family:'Playfair Display';font-size:17px;line-height:1.15;flex:1;min-width:0;}
.goal .d{font-size:11.5px;color:var(--gray);margin-top:4px;}
.goal .mt{font-family:'JetBrains Mono';font-weight:700;font-size:15px;text-align:right;flex:0 0 auto;white-space:nowrap;margin-top:2px;}
.goal .mk{font-family:'JetBrains Mono';font-size:7.5px;letter-spacing:.1em;color:var(--gray);text-align:right;}
.goal .pb{height:9px;background:var(--paper2);border-radius:99px;margin-top:13px;overflow:hidden;}
.goal .pf{height:100%;background:var(--gold);border-radius:99px;}
.goal .pr{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-family:'JetBrains Mono';font-size:10.5px;}
.goal .pr .c{font-weight:700;white-space:nowrap;}.goal .pr .p{color:var(--gold);font-weight:700;white-space:nowrap;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
padding:11px 16px;border-radius:4px;border:1px solid var(--line);background:var(--white);
font-family:'JetBrains Mono';font-size:10px;letter-spacing:.08em;color:var(--gray);
cursor:pointer;text-transform:uppercase;touch-action:manipulation;}
.btn.p{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn.g{background:var(--gold);color:var(--paper);border-color:var(--gold);}
.btn.full{width:100%;}
.btn.sm{min-height:34px;padding:7px 12px;font-size:9px;}
.btn.del{color:var(--red);border-color:rgba(158,59,46,.3);}
.actions{display:flex;gap:8px;margin-top:12px;}
.f{margin-bottom:12px;}
.f label{display:block;font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.12em;
color:var(--gray);text-transform:uppercase;margin-bottom:6px;}
.f input,.f select{width:100%;background:var(--inputbg);border:1px solid var(--line);border-radius:4px;
color:var(--ink);font-family:'Inter';font-size:16px;padding:13px;outline:none;min-height:50px;
-webkit-appearance:none;appearance:none;}
.f select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238C98A2' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
background-repeat:no-repeat;background-position:right 13px center;background-size:16px;padding-right:40px;}
.f input:focus,.f select:focus{border-color:var(--gold);}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.sheet{position:fixed;inset:0;background:transparent;z-index:70;display:none;align-items:flex-end;
transition:background .28s cubic-bezier(.32,.72,0,1);}
.sheet.show{display:flex;}
.sheet.on{background:var(--sheetbg);}
.sb{width:100%;max-width:560px;margin:0 auto;background:var(--paper);border-radius:14px 14px 0 0;
padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);
-webkit-overflow-scrolling:touch;}
.sheet.on .sb{transform:translateY(0);}
.sb h3{font-family:'Playfair Display';font-size:21px;margin-bottom:4px;}
.sb h3 em{font-style:italic;color:var(--gold);}
.sb .sd{font-size:12px;color:var(--gray);margin-bottom:18px;}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
transform:translateX(-50%) translateY(14px) scale(.96);background:var(--ink);color:var(--paper);
padding:12px 20px;border-radius:99px;font-family:'JetBrains Mono';font-size:11px;
z-index:80;opacity:0;transition:transform .34s cubic-bezier(.32,.72,0,1),opacity .22s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
.empty{text-align:center;padding:34px 20px;color:var(--gray);font-size:13px;line-height:1.6;}
/* Transições Apple-style */
:root{--ease-ios:cubic-bezier(.32,.72,0,1);--ease-emph:cubic-bezier(.2,.9,.3,1.2);}
* { -webkit-tap-highlight-color:transparent; }
main{transition:opacity .18s var(--ease-ios), transform .28s var(--ease-ios);}
main.fx-out{opacity:0;transform:translateY(6px) scale(.995);}
@keyframes viewIn{0%{opacity:0;transform:translateY(10px) scale(.985);}60%{opacity:1;}100%{opacity:1;transform:translateY(0) scale(1);}}
main.fx-in{animation:viewIn .38s var(--ease-ios);}
.btn,.subchip,.tseg,button{transition:transform .18s var(--ease-ios), background-color .2s ease, color .2s ease, box-shadow .2s ease;}
.btn:active,.subchip:active,.tseg:active,button:active{transform:scale(.97);}
.card,.subcard,.goal,.kpi{transition:transform .25s var(--ease-ios), box-shadow .25s var(--ease-ios);}
.subcard:active{transform:scale(.985);}
.tr[onclick]{transition:background-color .15s ease, transform .18s var(--ease-ios);}
.tr[onclick]:active{transform:scale(.995);background-color:rgba(0,0,0,.03);}
/* nav com highlight animado */
nav .ic svg{transition:stroke .25s ease, transform .3s var(--ease-emph);}
nav button.on .ic svg{transform:scale(1.08);}
nav .t{transition:color .25s ease;}
/* barras do mês */
.mescol{transition:transform .2s var(--ease-ios);}
.mescol:active{transform:scale(.96);}
.mesbar span{transition:height .5s var(--ease-ios);}
/* auth */
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes cardUp{from{opacity:0;transform:translateY(18px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
/* respeitar preferência do usuário */
@media (prefers-reduced-motion:reduce){
  main,main.fx-in,main.fx-out,.sb,.sheet,.sheet.on,.toast,.btn,.subchip,.tseg,button,.card,.subcard,.goal,.kpi,.tr[onclick],nav .ic svg,nav,nav .lens,nav .ic,.mescol,.mesbar span{
    animation:none!important;transition:none!important;
  }
}
/* ── Tab bar Liquid Glass ── */
nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);
width:calc(100% - 24px);max-width:520px;z-index:50;display:flex;padding:5px;border-radius:999px;
background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
border:.5px solid var(--glassline);
box-shadow:0 10px 34px rgba(16,27,36,.16),0 2px 6px rgba(16,27,36,.06),inset 0 1px 0 var(--glasshi),inset 0 -1px 0 rgba(0,0,0,.04);
transition:transform .45s var(--ease-ios),padding .35s var(--ease-ios),width .45s var(--ease-ios);}
nav::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%);mix-blend-mode:soft-light;}
nav .lens{position:absolute;top:5px;bottom:5px;left:5px;width:0;border-radius:999px;pointer-events:none;
background:var(--lens);box-shadow:inset 0 1px 0 var(--glasshi),inset 0 0 0 .5px var(--glassline),0 3px 10px rgba(16,27,36,.08);
transition:left .5s cubic-bezier(.34,1.25,.5,1),width .5s cubic-bezier(.34,1.25,.5,1),transform .25s var(--ease-ios);}
nav.press .lens{transform:scale(1.06,1.1);}
nav button{position:relative;z-index:1;flex:1;min-width:0;background:none;border:none;padding:7px 0 6px;min-height:50px;cursor:pointer;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:manipulation;border-radius:999px;}
nav .ic{width:22px;height:22px;transition:transform .35s cubic-bezier(.34,1.4,.5,1);}
nav .ic svg{width:100%;height:100%;fill:none;stroke:var(--ink);opacity:.72;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s,opacity .25s;}
nav button.on .ic svg{stroke:var(--gold);opacity:1;stroke-width:2;}
nav button:active .ic{transform:scale(.88);}
nav .t{font-family:'Inter',system-ui,sans-serif;font-size:10px;font-weight:500;letter-spacing:-.01em;color:var(--ink);opacity:.72;
white-space:nowrap;transition:opacity .25s,color .25s,max-height .3s var(--ease-ios);max-height:14px;overflow:hidden;}
nav button.on .t{color:var(--gold);opacity:1;font-weight:600;}
nav.mini{width:calc(100% - 64px);padding:4px;}
nav.mini button{min-height:40px;padding:5px 0;}
nav.mini .t{max-height:0;opacity:0;}
@media (max-width:360px){header,main{padding-left:16px;padding-right:16px;}
h1{font-size:26px;}.kpi .v{font-size:22px;}nav .t{font-size:9px;}}
/* ── assinaturas ── */
.chk{display:flex;align-items:center;gap:9px;font-family:'Inter';font-size:14px;color:var(--ink);cursor:pointer;padding:4px 0;}
.chk input{width:20px;height:20px;accent-color:var(--gold);flex:0 0 auto;}
.subchips{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.subchip{font-family:'Inter';font-weight:600;font-size:13px;padding:8px 16px;border-radius:17px;border:1px solid var(--line);
background:var(--white);color:var(--ink);cursor:pointer;transition:.15s;}
.subchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.subcard{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;margin-bottom:10px;cursor:pointer;
transition:transform .1s;}
.subcard:active{transform:scale(.99);}
.subcard .ico{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);flex:0 0 auto;
display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-size:20px;font-weight:600;}
.subcard .info{flex:1;min-width:0;}
.subcard .t1{font-weight:700;font-size:17px;color:#0F1922;line-height:1.15;}
.subcard .t2{font-family:'JetBrains Mono';font-size:11px;color:#0F1922;opacity:.72;margin-top:4px;letter-spacing:.02em;}
.subcard .cobra{background:rgba(255,255,255,.85);color:#0F1922;font-family:'JetBrains Mono';
font-size:10px;font-weight:700;padding:8px 12px;border-radius:14px;white-space:nowrap;flex:0 0 auto;letter-spacing:.04em;text-transform:uppercase;}
.subresumo{background:#B7D89A;border-radius:18px;padding:18px;margin:14px 0;}
.subresumo .lab2{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.14em;color:#3A4D2A;}
.subresumo .big{font-family:'Inter';font-weight:800;font-size:38px;color:#0F1922;margin-top:8px;line-height:1;}
.subresumo .sub2{font-size:13px;color:#3A4D2A;margin-top:8px;}
.subgasto{background:var(--navy);border-radius:18px;padding:18px;margin-top:12px;}
.subgasto .lab3{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.14em;color:#8FA0B4;}
.subgasto .grow{display:flex;align-items:baseline;gap:10px;margin-top:10px;}
.subgasto .bg{font-family:'Inter';font-weight:800;font-size:34px;color:var(--paper);line-height:1;}
.subgasto .per{font-size:13px;color:#8FA0B4;}
.subgasto .ano{font-size:13px;color:#8FA0B4;margin-top:6px;}
.subgasto .faixa{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.06);
border-radius:12px;padding:12px 16px;margin-top:14px;}
.subgasto .fk{font-family:'JetBrains Mono';font-size:8px;letter-spacing:.12em;color:#8FA0B4;}
.subgasto .fv{font-family:'Inter';font-weight:700;font-size:16px;color:var(--paper);margin-top:3px;}
.subgasto .fd{width:1px;align-self:stretch;background:rgba(255,255,255,.14);}
.temaseg{display:flex;gap:6px;background:var(--paper2);border-radius:14px;padding:4px;margin-top:6px;}
.tseg{flex:1;padding:11px 8px;border:none;background:transparent;font-family:'Inter';font-weight:600;font-size:13px;
color:var(--gray);border-radius:11px;cursor:pointer;transition:.15s;}
.tseg.on{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06);}
.saud{margin-bottom:16px;}
.saud .s1{font-family:'Playfair Display';font-weight:400;font-size:24px;line-height:1.15;color:var(--ink);}
.saud .s1 em,.saud .s1 strong{font-style:italic;color:var(--gold);font-weight:400;}
.saud .s2{font-size:13px;color:var(--gray);margin-top:4px;}
.mesescard{padding:18px 14px 14px;}
.mesesbar{display:flex;align-items:flex-end;gap:6px;height:140px;overflow-x:auto;scroll-snap-type:x mandatory;
scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.mesesbar::-webkit-scrollbar{display:none;}
.mescol{flex:0 0 calc((100% - 30px)/6);display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;scroll-snap-align:start;cursor:pointer;}
.mescol.pass .mesbar span{background:var(--gray);opacity:.45;}
.mescol.pass .mesk{opacity:.8;}
.mescol .mesv{font-family:'JetBrains Mono';font-size:9px;color:var(--gray);letter-spacing:.02em;}
.mescol .mesbar{width:100%;height:88px;background:var(--paper2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;}
.mescol .mesbar span{display:block;width:100%;background:var(--gold);border-radius:8px;min-height:6px;}
.mescol.on .mesbar span{background:var(--navy);}
.mescol .mesk{font-family:'JetBrains Mono';font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;}
.mescol.on .mesk{color:var(--gold);font-weight:700;}
.subcard .st{background:rgba(255,255,255,.88);margin:0;}
.subcard .st.ok{color:#2F6B4F;}.subcard .st.no{color:#9E3B2E;}
.st.pv{background:var(--paper2);color:var(--gray);cursor:default;}

    D[tp]=D[tp].filter(x=>{ const tmp=D[tp]; D[tp]=vistos; const d=duplicata(tp,x,x.id); D[tp]=tmp; if(d) return false; vistos.push(x); return true; }); });
  { const vistos={}; D.metas=D.metas.filter(m=>{ const k=normNome(m.n); if(vistos[k]){ const clone=valEq(vistos[k].a,m.a)&&valEq(vistos[k].m,m.m); if(!clone) vistos[k].a=(+vistos[k].a||0)+(+m.a||0);
      D.pagar.forEach(p=>{ if(p.meta===m.id) p.meta=vistos[k].id; }); return false; } vistos[k]=m; return true; }); }
  if(!D.apIds) D.apIds={};
  D.pagar.forEach(p=>{ if(p.ext && !D.apIds[p.ext]) D.apIds[p.ext]=Date.now(); });
}

/* ═══════ COMPETÊNCIA (mês da conta) ═══════ */
const NOMES_MES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function compFromDt(dt){ return dt && dt.length>=7 ? dt.slice(0,7) : null; }
const K=n=>(n/1000).toFixed(1).replace(".",",")+"k";
/* ═══════ REGRAS DE UNICIDADE ═══════ */
function normNome(t){ return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim(); }
function parseNum(v){ v=String(v==null?"":v).trim(); if(!v) return null; if(v.includes(",")) v=v.replace(/\./g,"").replace(",","."); return parseFloat(v)||0; }
function compDe(x){ return x.comp||D.config.compAtual; }
function valEq(a,b){ return Math.abs((+a||0)-(+b||0))<0.005; }
// mesma conta/recebível no mesmo mês: assinatura = mesmo nome; aporte = mesmo nome e meta; demais = nome + valor + dia
function duplicata(tp,o,ignorarId){
  return (D[tp]||[]).find(x=>x.id!==ignorarId && compDe(x)===compDe(o) && normNome(x.n)===normNome(o.n) && (
    tp==="pagar" && (o.sub||x.sub) ? !!(o.sub&&x.sub) :
    tp==="pagar" && (o.inv||x.inv) ? !!(o.inv&&x.inv) && x.meta===o.meta && x.d===o.d :
    valEq(x.v,o.v) && x.d===o.d ));
}
function metaDuplicada(nome,ignorarId){ return D.metas.find(m=>m.id!==ignorarId && normNome(m.n)===normNome(nome)); }
function fv(P,i,n){ return i?P*(((1+i)**n-1)/i):P*n; }
function monthName(comp){ const p=(comp||"").split("-"); const m=+p[1]; return NOMES_MES[(m-1+12)%12]||""; }
function compMais(comp,n){ let [y,m]=(comp||"2026-01").split("-").map(Number); const t=(y*12+(m-1))+n; y=Math.floor(t/12); m=(t%12)+1; return y+"-"+String(m).padStart(2,"0"); }
function nextComp(comp){ return compMais(comp,1); }
function shiftDt(dt,comp,dfb){ const day = dt&&dt.length>=10 ? dt.slice(8,10) : (dfb||"01"); return comp+"-"+day; }
function inCur(x){ return (x.comp||D.config.compAtual)===D.config.compAtual; }

/* ═══════ CÁLCULO ═══════ */
function calc(){
  const P=D.pagar.filter(inCur), R=D.receber.filter(inCur);
  const saidas=P.reduce((a,b)=>a+ +b.v,0);
  const pago=P.filter(p=>p.s).reduce((a,b)=>a+ +b.v,0);
  const entradas=R.reduce((a,b)=>a+ +b.v,0);
  const receb=R.filter(r=>r.s===2).reduce((a,b)=>a+ +b.v,0)
             +R.filter(r=>r.s===1).reduce((a,b)=>a+ +b.v/2,0);
  const recor=R.filter(r=>r.t==="Recorrente").reduce((a,b)=>a+ +b.v,0);
  const sobra=entradas-saidas;
  const saldo=receb-pago;
  return {saidas,pago,aberto:saidas-pago,entradas,receb,areceber:entradas-receb,
          recor,sobra,saldo,taxa:entradas?Math.round(sobra/entradas*100):0};
}

/* ═══════ CONTEÚDO POR COMPETÊNCIA ═══════ */
function contasDoComp(comp){
  const cur=D.config.compAtual;
  const real=D.pagar.filter(p=>(p.comp||cur)===comp);
  if(comp<=cur) return real;
  const d=compDiff(cur,comp);
  const prev=D.pagar.filter(p=>inCur(p) && ((p.sub && (p.ciclo!=="anual" || d%12===0)) || p.inv))
    .filter(p=>!real.some(r=>r.n===p.n && (r.sub||r.inv)))
    .map(p=>({...p,s:0,prev:1}));
  return real.concat(prev);
}
function recebDoComp(comp){
  const cur=D.config.compAtual;
  const real=D.receber.filter(r=>(r.comp||cur)===comp);
  if(comp<=cur) return real;
  const prev=D.receber.filter(r=>inCur(r) && r.t==="Recorrente")
    .filter(r=>!real.some(x=>x.n===r.n && x.t==="Recorrente"))
    .map(r=>({...r,s:0,prev:1}));
  return real.concat(prev);
}
/* ═══════ NAVEGAÇÃO ENTRE MESES ═══════ */
function compDiff(a,b){ const[ya,ma]=a.split("-").map(Number),[yb,mb]=b.split("-").map(Number); return (yb*12+mb)-(ya*12+ma); }
function irComp(comp){
  const cur=D.config.compAtual, d=compDiff(cur,comp);
  if(d>=0) return verMes(d);
  const hs=(D.hist||[]).find(x=>x.comp===comp);
  if(hs) return verHist(hs.id);
  $('sbody').innerHTML=`${mesNav(comp)}<div class="empty">Nenhuma fatura registrada em ${monthName(comp).toLowerCase()}.</div>
   <button class="btn full" style="margin-top:12px;" onclick="closeSheet()">Fechar</button>`;
  openSheet();
}
function mesNav(comp){
  const cur=D.config.compAtual;
  const antes=(D.hist||[]).some(x=>x.comp && x.comp<comp);
  const podeVoltar = comp>cur || antes;
  const podeIr = compDiff(cur,comp)<5;
  return `<div class="mnav">
   <button class="mnb" ${podeVoltar?`onclick="irComp('${compMais(comp,-1)}')"`:'disabled'} aria-label="Mês anterior">‹</button>
   <div class="mnt"><h3>${monthName(comp)} <em>${comp.split("-")[0]}</em></h3>
    <div class="mns">${comp===cur?'FATURA ATUAL':comp<cur?'FECHADA':'PREVISTA'}</div></div>
   <button class="mnb" ${podeIr?`onclick="irComp('${compMais(comp,1)}')"`:'disabled'} aria-label="Próximo mês">›</button>
  </div>`;
}

}

  const cur=D.config.compAtual;
  const P=D.pagar.filter(inCur).map(p=>({n:p.n,f:p.f,v:+p.v,s:p.s?1:0,d:p.d||'',sub:p.sub?1:0}));
  const R=D.receber.filter(inCur).map(r=>({n:r.n,t:r.t,v:+r.v,s:r.s,d:r.d||''}));
  return {

    receb:c.receb, sobra:c.sobra, saldo:c.saldo,
    nPagar:P.length, nReceber:R.length,
    metaTotal:D.metas.reduce((s,m)=>s+ +m.a,0),
    itens:{pagar:P, receber:R}
  };
}
function fecharFatura(){
  if(!D.hist) D.hist=[];
  const cur=D.config.compAtual;
  const nxt=nextComp(cur);
  // 1) snapshot da fatura atual
  const snap=snapAtual();
  const i=D.hist.findIndex(x=>x.comp===cur);
  if(i>=0) D.hist[i]=snap; else D.hist.unshift(snap);
  D.hist.sort((a,b)=>b.ts-a.ts);
  // 2) virar contas (estilo fatura de cartão)
  const outros=D.pagar.filter(p=>(p.comp||cur)!==cur); // meses já existentes ficam
  const doMes=D.pagar.filter(p=>(p.comp||cur)===cur);
  const novos=[];
  doMes.forEach(p=>{
    if(p.sub){
      // assinatura mensal reaparece no próximo mês; anual reaparece daqui a 12 meses
      const alvo = p.ciclo==="anual" ? compMais(cur,12) : nxt;
      novos.push({...p, id:uid(), comp:alvo, dt:shiftDt(p.dt,alvo,p.d), s:0});
      // instância atual: arquivada no histórico (some do ativo)
    } else if(p.inv){
      // aporte reaparece no próximo mês em aberto
      novos.push({...p, id:uid(), comp:nxt, dt:shiftDt(p.dt,nxt,p.d), s:0});
    } else {
      // conta avulsa: paga → arquiva; em aberto → vira pro próximo mês (saldo rotativo)
      if(!p.s) novos.push({...p, comp:nxt, dt:shiftDt(p.dt,nxt,p.d)});
    }
  });
  const addSemDup=(L,tp,x)=>{ const tmp=D[tp]; D[tp]=L; const d=duplicata(tp,x,x.id); D[tp]=tmp; if(!d) L.push(x); };
  const finalP=outros.slice(); novos.forEach(x=>addSemDup(finalP,"pagar",x));
  D.pagar=finalP;
  // recebíveis: recorrentes reaparecem; avulsos recebidos arquivam; a receber viram
  const outrosR=D.receber.filter(r=>(r.comp||cur)!==cur);
  const doMesR=D.receber.filter(r=>(r.comp||cur)===cur);
  const novosR=[];
  doMesR.forEach(r=>{
    if(r.t==="Recorrente"){ novosR.push({...r, id:uid(), comp:nxt, dt:shiftDt(r.dt,nxt,r.d), s:0}); }
    else { if(r.s!==2) novosR.push({...r, comp:nxt, dt:shiftDt(r.dt,nxt,r.d)}); }
  });
  const finalR=outrosR.slice(); novosR.forEach(x=>addSemDup(finalR,"receber",x));
  D.receber=finalR;
  // 3) avança o mês
  D.config.compAtual=nxt;
  D.config.mes=monthName(nxt);
  save(); show('painel'); toast(`Fatura de ${snap.mes} fechada`);
}

/* ═══════ FAMILY OFFICE · DO ZERO AO MILHÃO ═══════
   Fonte única: patrimônio = metas (já guardado) · aporte = contas "Investimento" pagas
   · poupança = calc().taxa · histórico real = D.hist (metaTotal de cada mês fechado)
   · plano = D.config.aporte/taxa. Nada aqui guarda dado próprio. */
const PILARES=[
 {n:1,nome:"Reserva de Emergência & Liquidez",curto:"Reserva",foco:"Meta: 6 meses de custo",tags:"Tesouro Selic · CDB 100% CDI D+0",cor:"var(--p1)"},
 {n:2,nome:"Renda Fixa & Crescimento Seguro",curto:"Renda Fixa",foco:"Foco: ganho real",tags:"Tesouro IPCA+ · LCI · LCA",cor:"var(--p2)"},
 {n:3,nome:"Renda Variável & Multiplicação",curto:"Renda Variável",foco:"Foco: proventos",tags:"FIIs · Ações · ETFs globais",cor:"var(--p3)"},
 {n:4,nome:"Formação de Capital",curto:"Formação",foco:"Métrica: aporte e poupança",tags:"Caixa e objetivos em formação",cor:"var(--p4)"}
];
const IPCA_REF=4.5;
const pct1=n=>(Math.round((+n||0)*10)/10).toFixed(1).replace(".",",")+"%";
function pilarDe(m){ return +m.pilar || 4; }
function guardado(p){ return D.metas.filter(m=>!p||pilarDe(m)===p).reduce((s,m)=>s+ +m.a,0); }
function taxaAA(m){ return m.aa!=null&&m.aa!==""?+m.aa:(((1+(+D.config.taxa||0)/100)**12-1)*100); }
function rendaMes(p){ return D.metas.filter(m=>!p||pilarDe(m)===p).reduce((s,m)=>s+(+m.a)*((m.dy!=null&&m.dy!=="")?+m.dy:taxaAA(m))/1200,0); }
function rentMedia(p){ const L=D.metas.filter(m=>pilarDe(m)===p), t=guardado(p); return t?L.reduce((s,m)=>s+(+m.a)*taxaAA(m),0)/t:0; }
function aporteMes(comp){ comp=comp||D.config.compAtual;
  return D.pagar.filter(p=>p.inv && p.s && (p.comp||D.config.compAtual)===comp).reduce((s,p)=>s+ +p.v,0); }
function montante(P,A,i,n){ return P*(1+i)**n + fv(A,i,n); }
function mesesAte(P,A,i,alvo){ alvo=alvo||1e6; for(let n=0;n<=1200;n++){ if(montante(P,A,i,n)>=alvo) return n; } return Infinity; }
function tempoTxt(n){ if(!isFinite(n)) return "—"; if(n<=0) return "agora"; const a=Math.floor(n/12),m=n%12;
  return [a?a+(a>1?" anos":" ano"):"",m?m+(m>1?" meses":" mês"):""].filter(Boolean).join(" e "); }
function mesAno(n){ if(!isFinite(n)) return "—"; const c=compMais(D.config.compAtual,n); return monthName(c).slice(0,3).toLowerCase()+"/"+c.slice(0,4); }
function histPat(){ const o={}; (D.hist||[]).forEach(h=>{ if(h.comp && h.metaTotal!=null) o[h.comp]=+h.metaTotal; }); return o; }
function inicioPat(){ const ks=Object.keys(histPat()).sort(); return ks[0]||D.config.compAtual; }
function patReal(m){ const c=compMais(inicioPat(),m), cur=D.config.compAtual;
  if(c===cur) return guardado(); if(c>cur) return null; const v=histPat()[c]; return v==null?null:v; }
function metricaPilar(p){
  const c=calc();
  if(p===1){ const cobre=c.saidas?guardado(1)/c.saidas:0;
    return {txt:"Cobertura do custo mensal", val:cobre.toFixed(1).replace(".",",")+" de 6 meses", sub:`${BRL(guardado(1))} para ${BRL(c.saidas)}/mês de saídas`, bar:Math.min(100,cobre/6*100)}; }
  if(p===2){ const r=rentMedia(2)-IPCA_REF; return {txt:"Ganho real médio", val:(r>=0?"+":"")+pct1(r)+" a.a.", sub:`rentabilidade média ${pct1(rentMedia(2))} − IPCA ${pct1(IPCA_REF)}`}; }
  if(p===3) return {txt:"Proventos estimados", val:BRL(rendaMes(3))+"/mês", sub:`${D.metas.filter(m=>pilarDe(m)===3).length} posições no pilar`};
  return {txt:"Taxa de poupança", val:c.taxa+"%", sub:`aporte do mês ${BRL(aporteMes())} · plano ${BRL(+D.config.aporte||0)}`, bar:Math.max(0,Math.min(100,c.taxa))};
}

  return h;

function foEvolucao(){
  const ini=inicioPat(), P0=histPat()[ini]!=null?histPat()[ini]:guardado(), A=+D.config.aporte||0, i=(+D.config.taxa||0)/100;
  const ms=[0,6,12,18,24], est=ms.map(m=>montante(P0,A,i,m)), real=ms.map(patReal);
  const hoje=compDiff(ini,D.config.compAtual);
  const W=340,H=180,pl=42,pr=12,pt=12,pb=26, mx=Math.max(...est,...real.filter(v=>v!=null),1)*1.08;
  const X=m=>pl+(W-pl-pr)*m/24, Y=v=>pt+(H-pt-pb)*(1-v/mx);
  let g="";
  for(let k=0;k<=4;k++){ const v=mx*k/4, y=Y(v);
    g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
        <text x="${pl-6}" y="${y+3}" text-anchor="end" style="font:9px 'JetBrains Mono';fill:var(--gray)">${K(v)}</text>`; }
  ms.forEach(m=>{ g+=`<text x="${X(m)}" y="${H-8}" text-anchor="middle" style="font:9px 'JetBrains Mono';fill:${m===__foEvo?'var(--ink)':'var(--gray)'};font-weight:${m===__foEvo?700:400}">${m?m+'m':'início'}</text>`; });
  const sx=X(__foEvo);
  g+=`<rect x="${sx-14}" y="${pt}" width="28" height="${H-pt-pb}" rx="8" fill="var(--paper2)" opacity=".7"/>`;
  if(hoje>=0 && hoje<=24) g+=`<line x1="${X(hoje)}" x2="${X(hoje)}" y1="${pt}" y2="${H-pb}" stroke="var(--gold)" stroke-width="1" stroke-dasharray="2 3"/>
     <text x="${X(hoje)+4}" y="${pt+9}" style="font:8.5px 'JetBrains Mono';fill:var(--gold)">hoje</text>`;
  const pe=est.map((v,k)=>`${k?'L':'M'}${X(ms[k])},${Y(v)}`).join(" ");
  g+=`<path d="${pe} L${X(24)},${H-pb} L${X(0)},${H-pb} Z" fill="var(--gold)" opacity=".07"/>
      <path d="${pe}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 4"/>`;
  const rp=real.map((v,k)=>v==null?null:[X(ms[k]),Y(v)]).filter(Boolean);
  if(rp.length>1) g+=`<path d="${rp.map((p,k)=>`${k?'L':'M'}${p[0]},${p[1]}`).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>`;
  rp.forEach(p=>{ g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="var(--white)" stroke="var(--ink)" stroke-width="2"/>`; });

  ms.forEach(m=>{ g+=`<rect x="${X(m)-16}" y="0" width="32" height="${H}" fill="transparent" style="cursor:pointer" onclick="foEvoSel(${m})"/>`; });
  const k=ms.indexOf(__foEvo), e=est[k], r=real[k], d=r==null?null:r-e;
  return `<div class="fo-leg2"><span><i></i>Real (meses fechados)</span><span><i class="e"></i>Estimado</span></div>
   <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:6px">${g}</svg>

   <div class="fo-ev">

   </div>`;
}

function show(v){
  view=v;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  requestAnimationFrame(moveLens);
  $('ti').innerHTML=META[v][1];
  const m=$('main');
  const sheetOpen=$('sheet').classList.contains('on');
  const render=()=>{
    m.innerHTML=V[v]();
    const di=$('dbinfo');
    if(di){
      const n=D.pagar.length+D.receber.length+D.metas.length;
      const kb=(JSON.stringify(D).length/1024).toFixed(1).replace(".",",");
      const md=__user?"sincronizado na nuvem":{local:"salvo neste navegador",host:"salvo no app",memoria:"não está salvando"}[DB.modo];
      di.textContent=`${n} registros · ${kb} KB · ${md}`;
    }
    if(!sheetOpen) window.scrollTo(0,0);
    m.classList.remove('fx-out'); m.classList.add('fx-in');
    const mb=$('mesesbar'); if(mb){ const on=mb.querySelector('.mescol.on'); if(on) mb.scrollLeft=on.offsetLeft-mb.offsetLeft; }
  };
  if(__showT){ clearTimeout(__showT); __showT=null; }
  // se o sheet estiver aberto, evita animação de fundo pra não distrair
  if(sheetOpen){ m.classList.remove('fx-out','fx-in'); render(); __lastView=v; return; }
  const novaAba = v!==__lastView; __lastView=v;
  m.classList.remove('fx-in'); m.classList.add('fx-out');
  __showT=setTimeout(()=>{
    if(!novaAba){ __showT=null; render(); return; }
    m.innerHTML=skel(v); window.scrollTo(0,0);
    m.classList.remove('fx-out'); m.setAttribute('aria-busy','true');
    __showT=setTimeout(()=>{ __showT=null; m.removeAttribute('aria-busy'); m.classList.add('fx-out'); render(); }, SKEL_MS);
  }, novaAba?90:140);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ $('tabbar').classList.remove('mini'); show(b.dataset.v); });
/* ═══════ TAB BAR LIQUID GLASS ═══════ */
function moveLens(){
  const nb=$('tabbar'), on=nb&&nb.querySelector('button.on'), ln=$('lens'); if(!on||!ln) return;
  ln.style.left=on.offsetLeft+'px'; ln.style.width=on.offsetWidth+'px';
}
(function(){
  const nb=$('tabbar'); if(!nb) return;
  nb.addEventListener('pointerdown',()=>nb.classList.add('press'));
  ['pointerup','pointercancel','pointerleave'].forEach(e=>nb.addEventListener(e,()=>nb.classList.remove('press')));
  window.addEventListener('resize',moveLens);
  let lastY=0;
  window.addEventListener('scroll',()=>{
    const y=window.scrollY, d=y-lastY;
    if(y<60 || d<-6) nb.classList.remove('mini'); else if(d>6) nb.classList.add('mini');
    lastY=y;
  },{passive:true});
  nb.addEventListener('transitionend',moveLens);
})();


/* ═══════ AÇÕES ═══════ */
function tog(tp,id){
  const it=D[tp].find(x=>x.id===id); if(!it)return;
  const antes=it.s;
  it.s = tp==="pagar" ? (it.s?0:1) : (it.s+1)%3;
  // aporte automático: ao marcar como PAGO (0->1) um lançamento de Investimento, credita na meta
  if(tp==="pagar" && it.inv && it.meta && antes===0 && it.s===1){
    const m=D.metas.find(x=>x.id===it.meta);
    if(m){ m.a=(+m.a||0)+ +it.v; toast(`Aportado em ${m.n}`); }
  }
  if(tp==="pagar" && it.inv && it.meta && antes===1 && it.s===0){
    const m=D.metas.find(x=>x.id===it.meta);
    if(m){ m.a=Math.max(0,(+m.a||0)- +it.v); }
  }
  save(); show(view);
}

  tog('pagar',id);
  try{ navigator.vibrate && navigator.vibrate(8); }catch(e){}
  if(!it.inv) toast(it.s?`${it.n} paga`:`${it.n} reaberta`);

function del(tp,id){
  const k = tp==="meta"?"metas":tp;
  if(tp==="meta"){
    const abertos=D.pagar.filter(p=>p.inv && p.meta===id && !p.s);
    if(abertos.length){ toast(`Há ${abertos.length} aporte${abertos.length>1?'s':''} em aberto para esta meta`); return; }
    D.pagar.forEach(p=>{ if(p.inv && p.meta===id){ p.inv=0; p.meta=""; p.f="PIX"; } });
  }
  // se for uma conta de investimento JÁ PAGA, estorna o aporte da meta antes de excluir
  if(tp==="pagar"){
    const it=D.pagar.find(x=>x.id===id);
    if(it && it.inv && it.meta && it.s){
      const m=D.metas.find(x=>x.id===it.meta);
      if(m){ m.a=Math.max(0,(+m.a||0)- +it.v); }
    }
  }
  D[k]=D[k].filter(x=>x.id!==id);
  save(); closeSheet(); show(view); toast("Removido");
}

}
function closeSheet(){

  sh.classList.remove('on');
  setTimeout(()=>{ if(!sh.classList.contains('on')) sh.classList.remove('show'); }, 420);
}

function verMes(idx){
  const targetComp=compMais(D.config.compAtual,idx);
  const ano=+targetComp.split("-")[0];
  const nome=monthName(targetComp);
  const atual=(idx===0);

  let pagar=contasDoComp(targetComp), receber=recebDoComp(targetComp);
  const projetado=pagar.some(p=>p.prev);
  pagar=pagar.sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  receber=receber.sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  const saidas=pagar.reduce((a,b)=>a+ +b.v,0);
  const entradas=receber.reduce((a,b)=>a+ +b.v,0);
  const pago=pagar.filter(p=>p.s).reduce((a,b)=>a+ +b.v,0);
  const aberto=saidas-pago;
  const sobra=entradas-saidas;
  const pct=entradas?Math.max(0,Math.min(100,Math.round(saidas/entradas*100))):0;

  let h=`<div class="sd">${atual?'Mês atual · contas desta fatura.':(projetado?'Lançadas neste mês + recorrentes previstas.':'Contas lançadas neste mês.')}</div>
   <div class="kpis" style="margin-top:8px;">
    <div class="kpi"><div class="k">Saídas totais</div><div class="v">${BRL(saidas)}</div><div class="s">${pagar.length} lançamentos</div></div>
    <div class="kpi"><div class="k">Já pago</div><div class="v g">${BRL(pago)}</div><div class="s">${pagar.filter(p=>p.s).length} contas</div></div>
    <div class="kpi"><div class="k">Em aberto</div><div class="v rd">${BRL(aberto)}</div><div class="s">${pagar.filter(p=>!p.s).length} contas</div></div>
    <div class="kpi"><div class="k">Sobra</div><div class="v ${sobra>=0?'g':'rd'}">${BRL(sobra)}</div><div class="s">entradas − saídas</div></div>
   </div>
   <div class="lab">Contas</div>
   <div class="card">`;
  if(!pagar.length) h+=`<div class="empty">Sem contas.</div>`;
  pagar.forEach(p=>{
    const clic = !p.prev;
    h+=`<div class="tr" ${clic?`onclick="verConta('${p.id}',${idx})" style="cursor:pointer;"`:''}>
     <div class="nm"><div class="t1">${p.n}</div><div class="t2">${p.f}${p.sub?' · '+(p.ciclo||'mensal'):''} · dia ${p.d||'—'}</div>
      ${clic?`<div style="margin-top:5px;">${selo(p)}</div>`:`<div style="margin-top:5px;"><span class="st pv">PREVISTA</span></div>`}</div>
     <div class="vl">${BRL(p.v)}</div></div>`;
  });
  h+=`<div class="tot"><span class="l">Total de ${nome}</span><span class="v">${BRL(saidas)}</span></div></div>`;
  if(receber.length){
    h+=`<div class="lab">Recebíveis</div><div class="card">`;
    receber.forEach(p=>{
      h+=`<div class="tr">
       <div class="nm"><div class="t1">${p.n}</div><div class="t2">${p.t||''}${p.f?' · '+p.f:''} · dia ${p.d||'—'}</div></div>
       <div class="vl">${BRL(p.v)}</div></div>`;
    });
    h+=`<div class="tot"><span class="l">Total previsto</span><span class="v">${BRL(entradas)}</span></div></div>`;
  }
  h+=`<button class="btn full" style="margin-top:12px;" onclick="closeSheet()">Fechar</button>`;
  __ctx={t:'mes',idx};
  $('sbody').innerHTML=`${mesNav(targetComp)}${h}`;
  openSheet();
}

function salvar(tp,id){
  const g=i=>{const e=$(i);return e?e.value.trim():"";};
  if(tp==="meta"){
    const o={n:g('i_n'),d:g('i_d2'),m:parseMoney(g('i_m')),a:parseMoney(g('i_a')),
      pilar:+g('i_pl')||4,at:g('i_at'),em:g('i_em'),rt:g('i_rt'),pz:g('i_pz'),aa:parseNum(g('i_aa')),dy:parseNum(g('i_dy'))};
    if(!o.n){ toast("Informe o nome da meta"); return; }
    if(metaDuplicada(o.n,id)){ toast("Já existe uma meta com esse nome"); return; }
    if(id){Object.assign(D.metas.find(x=>x.id===id),o);} else {D.metas.push({id:uid(),...o});}
  } else {
    const v=parseMoney(g('i_v'));
    const isSub=g('i_f')==='Assinatura';
    const isInv=g('i_f')==='Investimento';
    let dt=g('i_dt')||"";
    const nome=g('i_n');
    if(!nome){ toast("Informe a descrição"); return; }
    if(!(v>0)){ toast("Informe um valor válido"); return; }
    if(!dt){ toast("Selecione a data"); return; }
    if(isInv && !g('i_meta')){ toast("Escolha a meta do aporte"); return; }
    // conta pertence à fatura atual: normaliza a data para o mês em aberto
    // competência = mês da data escolhida (mês já fechado entra na fatura atual)
    let compNew = compFromDt(dt);
    if(!compNew || compNew<D.config.compAtual) compNew=D.config.compAtual;
    const dia = dt.slice(8,10);
    dt = compNew+"-"+dia;
    const o = tp==="pagar"
      ? {d:dia,dt,comp:compNew,n:nome,f:g('i_f'),v,
         sub:isSub?1:0,ciclo:isSub?(g('i_ciclo')||"mensal"):"",
         inv:isInv?1:0,meta:isInv?g('i_meta'):""}
      : {d:dia,dt,comp:compNew,n:nome,t:g('i_t'),f:g('i_f'),v};
    const dup=duplicata(tp,o,id);
    if(dup){ toast(o.sub?`${o.n} já existe em ${monthName(o.comp)}`:`Essa conta já existe em ${monthName(o.comp)}`); return; }
    if(id){
      const prev=D[tp].find(x=>x.id===id);
      // se estava paga e era aporte, reverte o efeito anterior na meta
      if(tp==="pagar" && prev && prev.s && prev.inv && prev.meta){
        const mp=D.metas.find(x=>x.id===prev.meta);
        if(mp){ mp.a=Math.max(0,(+mp.a||0)- +prev.v); }
      }
      Object.assign(prev,o);
      // reaplica com os novos dados se continua paga e é aporte
      if(tp==="pagar" && prev.s && o.inv && o.meta){
        const mn=D.metas.find(x=>x.id===o.meta);
        if(mn){ mn.a=(+mn.a||0)+ +o.v; }
      }
    }
    else {D[tp].push({id:uid(),...o,s:0});}
  }
  save(); closeSheet(); show(view);
  const cNew=(tp==="pagar"||tp==="receber")?compFromDt(g('i_dt')):null;
  toast(cNew && cNew>D.config.compAtual ? `Lançada em ${monthName(cNew)}` : (id?"Atualizado":"Adicionado"));
}

/* ═══════ APPLE PAY (compras gravadas pelo webhook no Supabase) ═══════ */
async function sha256hex(t){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function apGerar(){
  const abc="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789", r=crypto.getRandomValues(new Uint8Array(32));
  const t=[...r].map(x=>abc[x%abc.length]).join(""); const inp=$('ap_tok'); if(inp) inp.value=t;
  try{ navigator.clipboard && navigator.clipboard.writeText(t); }catch(e){}
  toast("Token copiado · toque em Salvar token",2600);
}
async function apSalvarToken(){
  if(!sb||!__user) return toast("Entre na conta primeiro");
  const v=($('ap_tok').value||"").trim();
  if(v.length<16) return toast("O token precisa de 16+ caracteres",2600);
  try{
    const {error}=await sb.from("bp_tokens").upsert({user_id:__user.id,token_hash:await sha256hex(v)});
    if(error) throw error;
    D.config.apConectado=true; save(); show('config'); toast("Token conectado ao atalho");
  }catch(e){ toast("Não foi possível salvar o token",2600); }
}
function isoLocal(iso){
  const d=new Date(iso); const x=isNaN(d)?new Date():d;
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
}
let __apBusy=false, __apLast=0, __apAviso=false;
function comPrazo(p,ms){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({name:"AbortError"}),ms||12000))]); }
async function syncApplePay(manual){
  if(!sb || !__user){ if(manual) toast("Entre na conta para sincronizar",2600); return; }
  if(__apBusy){ if(manual){ __apAviso=true; toast("Sincronizando…",15000); } return; }
  if(!manual && Date.now()-__apLast<5000) return;
  const avisar=()=>manual||__apAviso;
  __apBusy=true; __apLast=Date.now();
  if(manual) toast("Sincronizando…",15000);
  let msg="";
  try{
    const desde=new Date(Date.now()-60*864e5).toISOString();
    let r;
    try{ r=await comPrazo(sb.from("bp_compras").select("id,valor,estabelecimento,cartao,data").gte("recebido",desde).order("data")); }
    catch(e){ msg = e && e.name==="AbortError" ? "Servidor não respondeu" : "Sem conexão"; return; }
    if(r.error){ msg = /jwt|auth/i.test(r.error.message||"") ? "Sessão expirada · entre de novo" : "Falha no servidor"; return; }
    const items=Array.isArray(r.data)?r.data:[];
    sb.from("bp_compras").delete().lt("recebido",desde).then(()=>{},()=>{});
    if(!D.apIds) D.apIds={};
    let novas=0;
    items.forEach(c=>{
      if(!c || typeof c.id!=="string") return;
      if(D.apIds[c.id] || D.pagar.some(p=>p.ext===c.id)) return;
      D.apIds[c.id]=Date.now();
      const v=Math.round((+c.valor||0)*100)/100; if(!(v>0)) return;
      const dLoc=isoLocal(c.data);
      let comp=compFromDt(dLoc); if(!comp||comp<D.config.compAtual) comp=D.config.compAtual;
      const dia=dLoc.slice(8,10);
      if(duplicata("pagar",{n:String(c.estabelecimento||"Compra Apple Pay"),v,d:dia,comp})) return;
      D.pagar.push({id:uid(),ext:c.id,ap:1,d:dia,dt:comp+"-"+dia,comp,
        n:String(c.estabelecimento||"Compra Apple Pay").slice(0,60),f:"Cartão",
        cartao:String(c.cartao||"").slice(0,40),v,s:0,sub:0,ciclo:"",inv:0,meta:""});
      novas++;
    });
    // registro enxuto: esquece ids com mais de 120 dias (o servidor apaga com 60)
    const lim=Date.now()-120*864e5; Object.keys(D.apIds).forEach(k=>{ if(D.apIds[k]<lim) delete D.apIds[k]; });
    D.config.apSync=Date.now(); save();
    if(novas){ show(view); msg=`${novas} compra${novas>1?'s':''} do Apple Pay importada${novas>1?'s':''}`; __apAviso=true; }
    else { msg="Nenhuma compra nova"; if(view==='config') show('config'); }
  }catch(e){ msg="Erro ao importar compras"; }
  finally{
    __apBusy=false;
    if(msg && avisar()) toast(msg,2600);
    __apAviso=false;
  }
}
let __apRetry;
function apAuto(){
  if(document.visibilityState!=="visible") return;
  syncApplePay();
  clearTimeout(__apRetry);
  __apRetry=setTimeout(()=>{ if(document.visibilityState==="visible"){ __apLast=0; syncApplePay(); } },8000);
}
document.addEventListener("visibilitychange",apAuto);
window.addEventListener("pageshow",apAuto);
window.addEventListener("focus",apAuto);
window.addEventListener("online",apAuto);

/* ═══════ NUVEM (Supabase: Auth + RLS) ═══════ */
const CFG_KEY="bp-sb-cfg";
let sb=null, __user=null, __rev=0, __pushT=null, __pushing=false, __pushFila=false, __pendente=false, __base=null, __canal=null, __nuvemSt="ok", __nuvemTs=0;
async function cfgSupabase(){
  let cfg=null;
  try{ const r=await comPrazo(fetch("/api/config",{cache:"no-store"}),6000); if(r.ok){ cfg=await r.json(); localStorage.setItem(CFG_KEY,JSON.stringify(cfg)); } }catch(e){}
  if(!cfg){ try{ cfg=JSON.parse(localStorage.getItem(CFG_KEY)||"null"); }catch(e){} }
  return cfg && cfg.url && cfg.key ? cfg : null;
}
function temDados(o){ return !!o && ((o.pagar||[]).length+(o.receber||[]).length+(o.metas||[]).length)>0; }
function idsDe(o){ const r={}; ["pagar","receber","metas"].forEach(k=>{ r[k]=new Set((o[k]||[]).map(x=>x.id)); }); return r; }
function marcarBase(){ __base=idsDe(D); }
function salvarSync(){ try{ localStorage.setItem(DB.key+":sync",JSON.stringify({rev:__rev,pend:__pendente})); }catch(e){} }
function lerSync(){ try{ return JSON.parse(localStorage.getItem(DB.key+":sync")||"{}"); }catch(e){ return {}; } }
function nuvemTxt(){ return {ok:"sincronizado"+(__nuvemTs?" · "+tsFmt(__nuvemTs):""),salvando:"salvando na nuvem…",offline:"sem internet · salva ao reconectar",erro:"falha ao sincronizar · tentando de novo"}[__nuvemSt]||""; }
function statusNuvem(st){ __nuvemSt=st; if(st==="ok") __nuvemTs=Date.now(); const e=$('nuvemst'); if(e) e.textContent=nuvemTxt(); }
async function lerNuvem(){ const {data,error}=await comPrazo(sb.from("bp_state").select("data,rev").eq("user_id",__user.id).maybeSingle(),10000); if(error) throw error; return data; }
function aplicarNuvem(row){ D=novoEstado(row.data); __rev=row.rev; normaliza(); marcarBase(); DB.gravar(D); salvarSync(); show(view||"painel"); }

async function cloudBoot(){
  DB.init();
  const cfg=/^https?:$/.test(location.protocol) && window.supabase ? await cfgSupabase() : null;
  if(!cfg){ await load(); return; }                       // sem Supabase configurado: modo local
  sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,ses)=>{ if(ev==="PASSWORD_RECOVERY") authModo("nova"); if(ev==="SIGNED_OUT" && __user) sairLocal(); });
  const {data:{session}}=await sb.auth.getSession();
  if(session && session.user) await entrar(session.user); else authModo("entrar");
}
async function entrar(user){
  __user=user; DB.key="bp-financeiro:"+user.id;
  document.body.classList.remove("sem-sessao"); $('auth').hidden=true;
  const cache=await DB.ler(), sync=lerSync();
  let legado=null; try{ const v=localStorage.getItem(KEY); legado=v?JSON.parse(v):null; }catch(e){}
  let srv=null, offline=false;
  try{ srv=await lerNuvem(); }catch(e){ offline=true; }
  if(offline){ D=novoEstado(cache||legado||{pagar:[],receber:[],metas:[],hist:[]}); __rev=sync.rev||0; __pendente=!!sync.pend||!cache; statusNuvem("offline"); }
  else if(srv){
    if(cache && sync.pend && (sync.rev||0)===srv.rev){ D=novoEstado(cache); __rev=srv.rev; __pendente=true; }   // mudanças offline ainda não enviadas
    else { D=novoEstado(srv.data); __rev=srv.rev; __pendente=false;
      if(!cache && temDados(legado) && JSON.stringify(legado)!==JSON.stringify(srv.data) &&
         confirm("Este aparelho tem dados de antes do login.\n\nOK = usar os dados deste aparelho\nCancelar = usar os dados da nuvem")){ D=novoEstado(legado); __pendente=true; } }
  } else { D=novoEstado(cache||legado||{pagar:[],receber:[],metas:[],hist:[]}); __rev=0; __pendente=true; }
  try{ localStorage.removeItem(KEY); }catch(e){}
  normaliza(); marcarBase(); aplicaModo(); await DB.gravar(D); salvarSync(); show("painel");
  if(__pendente) pushNuvem(); else statusNuvem("ok");
  ouvirNuvem(); apAuto();
}
async function pushNuvem(){
  if(!sb||!__user) return;
  if(__pushing){ __pushFila=true; return; }
  if(!navigator.onLine){ statusNuvem("offline"); return; }
  __pushing=true; statusNuvem("salvando");
  try{
    const {data,error}=await comPrazo(sb.rpc("bp_save",{p_data:D,p_rev:__rev}),12000);
    if(error) throw error;
    if(data==null) await resolverConflito();
    else { __rev=data; __pendente=false; marcarBase(); statusNuvem("ok"); }
  }catch(e){ statusNuvem(navigator.onLine?"erro":"offline"); clearTimeout(__pushT); __pushT=setTimeout(pushNuvem,15000); }
  finally{ __pushing=false; salvarSync(); if(__pushFila){ __pushFila=false; pushNuvem(); } }
}
// outro aparelho salvou antes: parte da versão da nuvem e reaplica o que foi criado/apagado aqui
async function resolverConflito(){
  const row=await lerNuvem(); if(!row) return;
  const S=novoEstado(row.data), base=__base||idsDe({});
  ["pagar","receber","metas"].forEach(k=>{
    const aqui=new Set(D[k].map(x=>x.id));
    D[k].forEach(x=>{ if(!base[k].has(x.id) && !S[k].some(y=>y.id===x.id)) S[k].push(x); });
    S[k]=S[k].filter(y=>!(base[k].has(y.id) && !aqui.has(y.id)));
  });
  D=S; __rev=row.rev; normaliza(); await DB.gravar(D); show(view||"painel");
  const {data}=await sb.rpc("bp_save",{p_data:D,p_rev:__rev});
  if(data!=null){ __rev=data; __pendente=false; marcarBase(); statusNuvem("ok"); toast("Sincronizado com outro aparelho",2400); }
}
async function puxarNuvem(){
  if(!sb||!__user||__pushing) return;
  if(__pendente) return pushNuvem();
  try{ const row=await lerNuvem(); if(row && row.rev>__rev) aplicarNuvem(row); statusNuvem("ok"); }catch(e){ statusNuvem(navigator.onLine?"erro":"offline"); }
}
function ouvirNuvem(){
  if(__canal) sb.removeChannel(__canal);
  __canal=sb.channel("bp-"+__user.id)
    .on("postgres_changes",{event:"*",schema:"public",table:"bp_state",filter:"user_id=eq."+__user.id},p=>{ if(p.new && p.new.rev>__rev) puxarNuvem(); })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"bp_compras",filter:"user_id=eq."+__user.id},()=>{ __apLast=0; syncApplePay(); })
    .subscribe();
}
window.addEventListener("online",()=>{ if(__user) (__pendente?pushNuvem():puxarNuvem()); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && __user) puxarNuvem(); });

/* ── telas de acesso ── */
let __authModo="entrar";
function authModo(m){
  __authModo=m; document.body.classList.add("sem-sessao"); $('auth').hidden=false;
  const T={entrar:["Entre para sincronizar seus dados.","Entrar","Criar conta"],criar:["Crie sua conta com e-mail e senha.","Criar conta","Já tenho conta"],
           esqueci:["Enviaremos um link para redefinir a senha.","Enviar link","Voltar"],nova:["Defina sua nova senha.","Salvar senha","Voltar"]}[m];
  $('au_sub').textContent=T[0]; $('au_go').textContent=T[1]; $('au_alt').textContent=T[2];
  $('au_fe').style.display=m==="nova"?"none":""; $('au_fs').style.display=m==="esqueci"?"none":"";
  $('au_s').autocomplete=m==="entrar"?"current-password":"new-password";
  $('au_esq').style.display=m==="entrar"?"":"none"; $('au_msg').textContent="";
}
function authAlt(){ authModo(__authModo==="entrar"?"criar":"entrar"); }
function authErro(e){ const t=(e&&e.message)||"";
  return /invalid login/i.test(t)?"E-mail ou senha incorretos":/not confirmed/i.test(t)?"Confirme seu e-mail pelo link enviado":
    /already registered|already exists/i.test(t)?"Esse e-mail já tem conta · toque em Já tenho conta":/rate|too many/i.test(t)?"Muitas tentativas · aguarde um pouco":
    /password/i.test(t)?"Senha fraca · use 8+ caracteres":/fetch|network/i.test(t)?"Sem conexão":"Não foi possível concluir"; }
async function authEnviar(){
  const email=$('au_e').value.trim().toLowerCase(), senha=$('au_s').value, msg=$('au_msg'), go=$('au_go');
  if(__authModo!=="nova" && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ msg.textContent="Informe um e-mail válido"; return; }
  if(__authModo!=="esqueci" && senha.length<8){ msg.textContent="A senha precisa de 8+ caracteres"; return; }
  go.disabled=true; msg.textContent="Aguarde…";
  try{
    if(__authModo==="entrar"){ const {data,error}=await sb.auth.signInWithPassword({email,password:senha}); if(error) throw error; $('au_s').value=""; await entrar(data.user); }
    else if(__authModo==="criar"){ const {data,error}=await sb.auth.signUp({email,password:senha,options:{emailRedirectTo:location.origin}}); if(error) throw error;
      if(data.session){ $('au_s').value=""; await entrar(data.user); } else { authModo("entrar"); $('au_e').value=email; $('au_msg').textContent="Enviamos um link para seu e-mail. Confirme e entre."; } }
    else if(__authModo==="esqueci"){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin}); if(error) throw error; msg.textContent="Se o e-mail tiver conta, o link chega em instantes."; }
    else { const {data,error}=await sb.auth.updateUser({password:senha}); if(error) throw error; $('au_s').value=""; toast("Senha atualizada"); await entrar(data.user); }
  }catch(e){ msg.textContent=authErro(e); }
  finally{ go.disabled=false; }
}
async function sairConta(){
  if(!confirm("Sair desta conta neste aparelho?")) return;
  clearTimeout(__pushT); if(__pendente) await pushNuvem();
  await sb.auth.signOut(); sairLocal();
}
function sairLocal(){
  try{ localStorage.removeItem(DB.key); localStorage.removeItem(DB.key+":sync"); }catch(e){}
  if(__canal){ sb.removeChannel(__canal); __canal=null; }
  __user=null; __rev=0; __pendente=false; DB.key=KEY;
  D=novoEstado({pagar:[],receber:[],metas:[],hist:[]}); $('main').innerHTML=""; authModo("entrar");
}
/* ═══════ BOOT ═══════ */
(async ()=>{
  await cloudBoot();
  if(!__user) apAuto();
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});});}
</script>
