<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F5F2EA">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BP Financeiro">
<title>BP Financeiro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
:root{--paper:#F5F2EA;--paper2:#EDE9DE;--white:#FBF9F4;--ink:#0F1922;--gold:#8F7318;
--gold-l:#B69540;--navy:#16283C;--gray:#6E7681;--line:#DCD6C7;--green:#2F6B4F;--red:#9E3B2E;
--navbg:rgba(245,242,234,.97);--sheetbg:rgba(15,25,34,.55);--inputbg:#FBF9F4;}
html[data-t="dark"]{--paper:#0B1218;--paper2:#16222C;--white:#131D26;--ink:#F0EEE8;
--gold:#B69540;--gold-l:#C9AC63;--navy:#20344A;--gray:#8C98A2;--line:#26363F;
--green:#6EC896;--red:#DC6E5F;--navbg:rgba(11,18,24,.97);--sheetbg:rgba(0,0,0,.66);--inputbg:#16222C;}
html{background:var(--paper);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;transition:background .2s,color .2s;
padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;
overscroll-behavior-y:contain;}
.app{max-width:560px;margin:0 auto;}
header{padding:calc(18px + env(safe-area-inset-top)) 20px 10px;}
.eb{display:flex;justify-content:space-between;align-items:center;}
.eb .l{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.15em;color:var(--gold);}
.eb .r{display:flex;align-items:center;gap:10px;}
.eb .sv{font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.1em;color:var(--gray);}
.tt{width:52px;height:28px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);
position:relative;cursor:pointer;flex:0 0 auto;padding:0;touch-action:manipulation;}
.tt i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
background:var(--gold);transition:transform .22s;display:flex;align-items:center;justify-content:center;}
html[data-t="dark"] .tt i{transform:translateX(24px);}
.tt svg{width:13px;height:13px;fill:none;stroke:var(--paper);stroke-width:2.2;stroke-linecap:round;}
h1{font-family:'Playfair Display';font-weight:400;font-size:29px;line-height:1.06;margin-top:9px;}
h1 em{font-style:italic;color:var(--gold);}
.sub{font-family:'JetBrains Mono';font-size:9px;color:var(--gray);letter-spacing:.1em;margin-top:8px;}
.hr{height:1px;background:var(--line);margin:16px 20px 0;}
main{padding:16px 20px;}
.lab{font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.15em;color:var(--gray);
text-transform:uppercase;margin:22px 0 9px;display:flex;justify-content:space-between;align-items:center;}
.lab:first-child{margin-top:0;}
.card{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:10px;}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:14px;min-width:0;}
.kpi .k{font-family:'JetBrains Mono';font-size:8px;letter-spacing:.11em;color:var(--gray);text-transform:uppercase;line-height:1.3;}
.kpi .v{font-family:'Playfair Display';font-size:clamp(19px,6vw,25px);margin-top:6px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .v.g{color:var(--gold);}.kpi .v.gr{color:var(--green);}.kpi .v.rd{color:var(--red);}
.kpi .s{font-size:11px;color:var(--gray);margin-top:5px;line-height:1.3;}
.split{display:flex;height:34px;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:4px;}
.split div{display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono';font-size:9px;}
.tr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.tr:last-of-type{border-bottom:none;}
.tr .nm{flex:1;min-width:0;}
.tr .t1{font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;}
.tr .t2{font-family:'JetBrains Mono';font-size:10px;color:var(--gray);margin-top:3px;line-height:1.3;}
.tr .vl{font-family:'JetBrains Mono';font-size:14px;font-weight:700;text-align:right;white-space:nowrap;flex:0 0 auto;}
.tr .dt{font-family:'JetBrains Mono';font-size:11px;color:var(--gray);width:26px;flex:0 0 auto;text-align:center;}
.tot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 2px;
border-top:2px solid var(--ink);margin-top:4px;}
.tot .l{font-weight:700;font-size:14px;}
.tot .v{font-family:'JetBrains Mono';font-weight:700;font-size:16px;white-space:nowrap;}
.st{font-family:'JetBrains Mono';font-size:8.5px;font-weight:700;letter-spacing:.06em;
padding:6px 10px;border-radius:99px;flex:0 0 auto;cursor:pointer;border:none;min-height:30px;}
.st.ok{background:rgba(47,107,79,.12);color:var(--green);}
.st.no{background:rgba(158,59,46,.1);color:var(--red);}
.st.pa{background:rgba(143,115,24,.13);color:var(--gold);}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
.trio .b{background:var(--paper2);border-radius:4px;padding:12px 10px;}
.trio .k{font-family:'JetBrains Mono';font-size:7.5px;letter-spacing:.1em;color:var(--gray);text-transform:uppercase;line-height:1.3;}
.trio .v{font-family:'Playfair Display';font-size:19px;margin-top:5px;line-height:1;}
.note{background:var(--paper2);border-left:3px solid var(--gold);border-radius:4px;
padding:13px 14px;font-size:12.5px;color:var(--gray);line-height:1.55;margin-top:12px;}
.note b{color:var(--ink);}
.mrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:6px;align-items:center;
padding:9px 0;border-bottom:1px solid var(--line);}
.mrow:last-of-type{border-bottom:none;}
.mrow .m{font-family:'JetBrains Mono';font-size:11px;font-weight:700;}
.mrow input{width:100%;background:transparent;border:none;border-bottom:1px dashed var(--line);
font-family:'JetBrains Mono';font-size:12px;text-align:right;color:var(--ink);
padding:5px 2px;outline:none;min-height:32px;-webkit-appearance:none;}
.mrow input:focus{border-bottom-color:var(--gold);background:rgba(143,115,24,.05);}
.mrow .n{font-family:'JetBrains Mono';font-size:12px;text-align:right;}
.mrow .n.g{color:var(--gold);font-weight:700;}
.mhead{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--line);}
.mhead span{font-family:'JetBrains Mono';font-size:7.5px;letter-spacing:.1em;color:var(--gray);
text-transform:uppercase;text-align:right;}
.mhead span:first-child{text-align:left;}
.bar{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.bar:last-child{border-bottom:none;}
.bar .a{font-family:'JetBrains Mono';font-size:11px;width:74px;flex:0 0 auto;}
.bar .t{flex:1;height:9px;background:var(--paper2);border-radius:99px;overflow:hidden;}
.bar .f{height:100%;background:var(--navy);border-radius:99px;}
.bar.on .f{background:var(--gold);}
.bar.on .a,.bar.on .r{color:var(--gold);font-weight:700;}
.bar .r{font-family:'JetBrains Mono';font-size:11px;width:66px;text-align:right;flex:0 0 auto;}
.goal{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--gold);
border-radius:4px;padding:15px;margin-bottom:10px;}
.goal .h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.goal .n{font-family:'Playfair Display';font-size:17px;line-height:1.15;flex:1;min-width:0;}
.goal .d{font-size:11.5px;color:var(--gray);margin-top:4px;}
.goal .mt{font-family:'JetBrains Mono';font-weight:700;font-size:15px;text-align:right;flex:0 0 auto;white-space:nowrap;margin-top:2px;}
.goal .mk{font-family:'JetBrains Mono';font-size:7.5px;letter-spacing:.1em;color:var(--gray);text-align:right;}
.goal .pb{height:9px;background:var(--paper2);border-radius:99px;margin-top:13px;overflow:hidden;}
.goal .pf{height:100%;background:var(--gold);border-radius:99px;}
.goal .pr{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-family:'JetBrains Mono';font-size:10.5px;}
.goal .pr .c{font-weight:700;white-space:nowrap;}.goal .pr .p{color:var(--gold);font-weight:700;white-space:nowrap;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
padding:11px 16px;border-radius:4px;border:1px solid var(--line);background:var(--white);
font-family:'JetBrains Mono';font-size:10px;letter-spacing:.08em;color:var(--gray);
cursor:pointer;text-transform:uppercase;touch-action:manipulation;}
.btn.p{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn.g{background:var(--gold);color:var(--paper);border-color:var(--gold);}
.btn.full{width:100%;}
.btn.sm{min-height:34px;padding:7px 12px;font-size:9px;}
.btn.del{color:var(--red);border-color:rgba(158,59,46,.3);}
.actions{display:flex;gap:8px;margin-top:12px;}
.f{margin-bottom:12px;}
.f label{display:block;font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.12em;
color:var(--gray);text-transform:uppercase;margin-bottom:6px;}
.f input,.f select{width:100%;background:var(--inputbg);border:1px solid var(--line);border-radius:4px;
color:var(--ink);font-family:'Inter';font-size:16px;padding:13px;outline:none;min-height:50px;
-webkit-appearance:none;appearance:none;}
.f select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238C98A2' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
background-repeat:no-repeat;background-position:right 13px center;background-size:16px;padding-right:40px;}
.f input:focus,.f select:focus{border-color:var(--gold);}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.sheet{position:fixed;inset:0;background:transparent;z-index:70;display:none;align-items:flex-end;
transition:background .28s cubic-bezier(.32,.72,0,1);}
.sheet.show{display:flex;}
.sheet.on{background:var(--sheetbg);}
.sb{width:100%;max-width:560px;margin:0 auto;background:var(--paper);border-radius:14px 14px 0 0;
padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);
-webkit-overflow-scrolling:touch;}
.sheet.on .sb{transform:translateY(0);}
.sb h3{font-family:'Playfair Display';font-size:21px;margin-bottom:4px;}
.sb h3 em{font-style:italic;color:var(--gold);}
.sb .sd{font-size:12px;color:var(--gray);margin-bottom:18px;}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
transform:translateX(-50%) translateY(14px) scale(.96);background:var(--ink);color:var(--paper);
padding:12px 20px;border-radius:99px;font-family:'JetBrains Mono';font-size:11px;
z-index:80;opacity:0;transition:transform .34s cubic-bezier(.32,.72,0,1),opacity .22s;pointer-events:none;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
.empty{text-align:center;padding:34px 20px;color:var(--gray);font-size:13px;line-height:1.6;}
/* Transições Apple-style */
:root{--ease-ios:cubic-bezier(.32,.72,0,1);--ease-emph:cubic-bezier(.2,.9,.3,1.2);}
* { -webkit-tap-highlight-color:transparent; }
main{transition:opacity .18s var(--ease-ios), transform .28s var(--ease-ios);}
main.fx-out{opacity:0;transform:translateY(6px) scale(.995);}
@keyframes viewIn{0%{opacity:0;transform:translateY(10px) scale(.985);}60%{opacity:1;}100%{opacity:1;transform:translateY(0) scale(1);}}
main.fx-in{animation:viewIn .38s var(--ease-ios);}
.btn,.subchip,.tseg,button{transition:transform .18s var(--ease-ios), background-color .2s ease, color .2s ease, box-shadow .2s ease;}
.btn:active,.subchip:active,.tseg:active,button:active{transform:scale(.97);}
.card,.subcard,.goal,.kpi{transition:transform .25s var(--ease-ios), box-shadow .25s var(--ease-ios);}
.subcard:active{transform:scale(.985);}
.tr[onclick]{transition:background-color .15s ease, transform .18s var(--ease-ios);}
.tr[onclick]:active{transform:scale(.995);background-color:rgba(0,0,0,.03);}
/* nav com highlight animado */
nav .ic svg{transition:stroke .25s ease, transform .3s var(--ease-emph);}
nav button.on .ic svg{transform:scale(1.08);}
nav .t{transition:color .25s ease;}
/* barras do mês */
.mescol{transition:transform .2s var(--ease-ios);}
.mescol:active{transform:scale(.96);}
.mesbar span{transition:height .5s var(--ease-ios);}
/* auth */
.auth{animation:fadeIn .32s var(--ease-ios);}
.auth .acard{animation:cardUp .48s var(--ease-ios);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes cardUp{from{opacity:0;transform:translateY(18px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
/* respeitar preferência do usuário */
@media (prefers-reduced-motion:reduce){
  main,main.fx-in,main.fx-out,.sb,.sheet,.sheet.on,.toast,.btn,.subchip,.tseg,button,.card,.subcard,.goal,.kpi,.tr[onclick],nav .ic svg,.mescol,.mesbar span,.auth,.auth .acard{
    animation:none!important;transition:none!important;
  }
}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;
background:var(--navbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
border-top:1px solid var(--line);display:flex;z-index:50;padding:8px 6px calc(10px + env(safe-area-inset-bottom));}
nav button{flex:1;background:none;border:none;padding:8px 2px;min-height:52px;cursor:pointer;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;touch-action:manipulation;}
nav .ic{width:20px;height:20px;}
nav .ic svg{width:100%;height:100%;fill:none;stroke:var(--gray);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
nav button.on .ic svg{stroke:var(--gold);}
nav .t{font-family:'JetBrains Mono';font-size:8px;color:var(--gray);text-transform:uppercase;}
nav button.on .t{color:var(--gold);font-weight:700;}
@media (max-width:360px){header,main{padding-left:16px;padding-right:16px;}
.hr{margin-left:16px;margin-right:16px;}h1{font-size:26px;}.kpi .v{font-size:22px;}nav .t{font-size:7px;}}
/* ── assinaturas ── */
.chk{display:flex;align-items:center;gap:9px;font-family:'Inter';font-size:14px;color:var(--ink);cursor:pointer;padding:4px 0;}
.chk input{width:20px;height:20px;accent-color:var(--gold);flex:0 0 auto;}
.subchips{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.subchip{font-family:'Inter';font-weight:600;font-size:13px;padding:8px 16px;border-radius:17px;border:1px solid var(--line);
background:var(--white);color:var(--ink);cursor:pointer;transition:.15s;}
.subchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.subcard{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;margin-bottom:10px;cursor:pointer;
transition:transform .1s;}
.subcard:active{transform:scale(.99);}
.subcard .ico{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);flex:0 0 auto;
display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-size:20px;font-weight:600;}
.subcard .info{flex:1;min-width:0;}
.subcard .t1{font-weight:700;font-size:17px;color:#0F1922;line-height:1.15;}
.subcard .t2{font-family:'JetBrains Mono';font-size:11px;color:#0F1922;opacity:.72;margin-top:4px;letter-spacing:.02em;}
.subcard .cobra{background:rgba(255,255,255,.85);color:#0F1922;font-family:'JetBrains Mono';
font-size:10px;font-weight:700;padding:8px 12px;border-radius:14px;white-space:nowrap;flex:0 0 auto;letter-spacing:.04em;text-transform:uppercase;}
.subresumo{background:#B7D89A;border-radius:18px;padding:18px;margin:14px 0;}
.subresumo .lab2{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.14em;color:#3A4D2A;}
.subresumo .big{font-family:'Inter';font-weight:800;font-size:38px;color:#0F1922;margin-top:8px;line-height:1;}
.subresumo .sub2{font-size:13px;color:#3A4D2A;margin-top:8px;}
.subgasto{background:var(--navy);border-radius:18px;padding:18px;margin-top:12px;}
.subgasto .lab3{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.14em;color:#8FA0B4;}
.subgasto .grow{display:flex;align-items:baseline;gap:10px;margin-top:10px;}
.subgasto .bg{font-family:'Inter';font-weight:800;font-size:34px;color:var(--paper);line-height:1;}
.subgasto .per{font-size:13px;color:#8FA0B4;}
.subgasto .ano{font-size:13px;color:#8FA0B4;margin-top:6px;}
.subgasto .faixa{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.06);
border-radius:12px;padding:12px 16px;margin-top:14px;}
.subgasto .fk{font-family:'JetBrains Mono';font-size:8px;letter-spacing:.12em;color:#8FA0B4;}
.subgasto .fv{font-family:'Inter';font-weight:700;font-size:16px;color:var(--paper);margin-top:3px;}
.subgasto .fd{width:1px;align-self:stretch;background:rgba(255,255,255,.14);}
.temaseg{display:flex;gap:6px;background:var(--paper2);border-radius:14px;padding:4px;margin-top:6px;}
.tseg{flex:1;padding:11px 8px;border:none;background:transparent;font-family:'Inter';font-weight:600;font-size:13px;
color:var(--gray);border-radius:11px;cursor:pointer;transition:.15s;}
.tseg.on{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06);}
.saud{margin-bottom:16px;}
.saud .s1{font-family:'Playfair Display';font-weight:400;font-size:24px;line-height:1.15;color:var(--ink);}
.saud .s1 em,.saud .s1 strong{font-style:italic;color:var(--gold);font-weight:400;}
.saud .s2{font-size:13px;color:var(--gray);margin-top:4px;}
.mesescard{padding:18px 14px 14px;}
.mesesbar{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:140px;}
.mescol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
.mescol .mesv{font-family:'JetBrains Mono';font-size:9px;color:var(--gray);letter-spacing:.02em;}
.mescol .mesbar{width:100%;height:88px;background:var(--paper2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;}
.mescol .mesbar span{display:block;width:100%;background:var(--gold);border-radius:8px;min-height:6px;}
.mescol.on .mesbar span{background:var(--navy);}
.mescol .mesk{font-family:'JetBrains Mono';font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;}
.mescol.on .mesk{color:var(--gold);font-weight:700;}
.mesnota{font-size:11px;color:var(--gray);margin-top:12px;text-align:center;}
.fatura{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);
border-radius:14px;padding:16px 18px;margin-top:14px;}
.fatura .fk2{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.12em;color:#8FA0B4;}
.fatura .fv2{font-family:'Playfair Display';font-size:22px;color:var(--paper);margin-top:4px;line-height:1;white-space:nowrap;}
.fatura .fv2 span{font-family:'Inter';font-size:11px;color:#8FA0B4;}
.fatura .btn{flex:0 0 auto;}
.auth{position:fixed;inset:0;z-index:200;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px;}
.auth .acard{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:420px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.06);}
.auth .ab{display:flex;background:var(--paper2);border-radius:12px;padding:4px;margin-bottom:20px;}
.auth .tab{flex:1;text-align:center;padding:10px;font-family:'Inter';font-weight:600;font-size:13px;color:var(--gray);border-radius:9px;cursor:pointer;}
.auth .tab.on{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06);}
.auth .af{margin-bottom:12px;}
.auth .af label{display:block;font-family:'JetBrains Mono';font-size:10px;letter-spacing:.08em;color:var(--gray);text-transform:uppercase;margin-bottom:6px;}

<script>
const BRL=n=>"R$ "+(Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const maskCPF=v=>String(v||"").replace(/\D/g,"").slice(0,11).replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2");
const maskMoney=v=>{ const n=String(v||"").replace(/\D/g,"").replace(/^0+/,""); if(!n) return ""; const p=n.padStart(3,"0"); return p.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+p.slice(-2); };
const parseMoney=v=>{ if(typeof v==="number") return v; const s=String(v||"").replace(/\./g,"").replace(",","."); return +s||0; };
const K=n=>(n/1000).toFixed(1).replace(".",",")+"k";
const $=i=>document.getElementById(i);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ═══════ ESTADO ═══════ */
const SEED={
 config:{aporte:2500,taxa:0.9,mes:"Agosto",compAtual:"2026-08",tema:"auto",nome:"",cpf:""},
 pagar:[
  {id:uid(),d:"05",n:"Moradia",f:"Débito automático",v:1200,s:1},

  {id:uid(),d:"10",n:"Celular",f:"Cartão",v:60,s:1},

  {id:uid(),d:"15",n:"Água",f:"Boleto",v:70,s:0},
  {id:uid(),d:"05",n:"Adobe CC",f:"Assinatura",v:79.90,s:0,sub:1,ciclo:"mensal"},
  {id:uid(),d:"10",n:"Vercel Pro",f:"Assinatura",v:100,s:0,sub:1,ciclo:"mensal"},
  {id:uid(),d:"12",n:"Figma",f:"Assinatura",v:68,s:0,sub:1,ciclo:"mensal"},
  {id:uid(),d:"15",n:"ChatGPT",f:"Assinatura",v:116,s:0,sub:1,ciclo:"mensal"},
  {id:uid(),d:"24",n:"Spotify",f:"Assinatura",v:21.90,s:0,sub:1,ciclo:"anual"},

  {id:uid(),d:"30",n:"Cartão de crédito",f:"Débito",v:1800,s:0}],
 receber:[
  {id:uid(),d:"05",n:"Cliente A — social media",t:"Recorrente",f:"mensal",v:900,s:2},
  {id:uid(),d:"10",n:"Cliente B — manutenção",t:"Recorrente",f:"mensal",v:400,s:2},
  {id:uid(),d:"15",n:"Recomix — landing page",t:"Projeto",f:"50% entrada",v:2500,s:1},
  {id:uid(),d:"20",n:"Cliente C — identidade",t:"Projeto",f:"à vista",v:1800,s:0},
  {id:uid(),d:"25",n:"Workana — automação",t:"Projeto",f:"escrow",v:1400,s:0},

  {id:uid(),d:"30",n:"Consultoria avulsa",t:"Projeto",f:"PIX",v:800,s:0}],
 metas:[
  {id:uid(),n:"Reserva de emergência",d:"6 meses de custo fixo",m:21900,a:8400},
  {id:uid(),n:"Equipamento do estúdio",d:"notebook e monitor",m:12000,a:3200},
  {id:uid(),n:"Investimento longo prazo",d:"36 meses de aporte",m:100000,a:18500},
  {id:uid(),n:"Reserva de oportunidade",d:"curso, viagem, imprevisto",m:6000,a:2400}],
 hist:[],
 log:[]
};
const MESES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
let D=JSON.parse(JSON.stringify(SEED)), view="painel";

/* ═══════ TEMA ═══════ */
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
function aplicaTema(t){
  document.documentElement.setAttribute('data-t',t);
  const mc=document.querySelector('meta[name="theme-color"]');
  if(mc) mc.setAttribute('content', t==='dark'?'#0B1218':'#F5F2EA');
}
async function setTema(t){
  D.config.tema=t; aplicaModo(); save();
}
function aplicaModo(){
  const t=D.config.tema||'auto';
  if(t==='auto'){
    const mq=window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    aplicaTema(mq && mq.matches?'dark':'light');
  } else aplicaTema(t);
}
if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const h=()=>{ if((D && D.config && (D.config.tema||'auto'))==='auto') aplicaModo(); };
  if(mq.addEventListener) mq.addEventListener('change',h); else if(mq.addListener) mq.addListener(h);
}

/* ═══════ PERSISTÊNCIA ═══════ */
const KEY="bp-financeiro";
const DB={
  modo:"local", mem:null,
  init(){ try{ const t="__t"; localStorage.setItem(t,"1"); localStorage.removeItem(t); this.modo="local"; }catch(e){ this.modo="memoria"; } },
  async ler(){ try{ if(this.modo==="local"){ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; } return this.mem; }catch(e){ return null; } },
  async gravar(obj){ try{ if(this.modo==="local"){ localStorage.setItem(KEY,JSON.stringify(obj)); return true; } this.mem=obj; return true; }catch(e){ return false; } },
  async limpar(){ try{ if(this.modo==="local") localStorage.removeItem(KEY); this.mem=null; }catch(e){} }
};

async function load(){
  DB.init();
  const salvo=await DB.ler();
  if(salvo) D=Object.assign(D,salvo);
  if(DB.modo==="memoria"){ const sv=$('sv'); if(sv) sv.textContent="sem salvar"; }
  // migração: garante competência em cada conta
  if(!D.config.compAtual) D.config.compAtual="2026-08";
  D.pagar.forEach(p=>{ if(!p.comp) p.comp=compFromDt(p.dt)||D.config.compAtual; });
  D.receber.forEach(r=>{ if(!r.comp) r.comp=compFromDt(r.dt)||D.config.compAtual; });
  if(!D.hist) D.hist=[]; if(!D.log) D.log=[];
  aplicaModo();
  show("painel");
}
let sT;
async function save(){
  const ok=await DB.gravar(D);
  const sv=$('sv'); if(sv) sv.textContent = ok ? "salvando…" : "erro ao salvar";
  clearTimeout(sT);
  sT=setTimeout(()=>{ const sv=$('sv'); if(sv) sv.textContent = DB.modo==="memoria" ? "sem salvar" : "salvo"; },600);
}
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on');
  setTimeout(()=>e.classList.remove('on'),1700); }

/* ═══════ COMPETÊNCIA (mês da conta) ═══════ */
const NOMES_MES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function compFromDt(dt){ return dt && dt.length>=7 ? dt.slice(0,7) : null; }
function monthName(comp){ const p=(comp||"").split("-"); const m=+p[1]; return NOMES_MES[(m-1+12)%12]||""; }
function compMais(comp,n){ let [y,m]=(comp||"2026-01").split("-").map(Number); const t=(y*12+(m-1))+n; y=Math.floor(t/12); m=(t%12)+1; return y+"-"+String(m).padStart(2,"0"); }
function nextComp(comp){ return compMais(comp,1); }
function shiftDt(dt,comp,dfb){ const day = dt&&dt.length>=10 ? dt.slice(8,10) : (dfb||"01"); return comp+"-"+day; }
function curComp(){ return D.config.compAtual; }
function inCur(x){ return (x.comp||D.config.compAtual)===D.config.compAtual; }

/* ═══════ CÁLCULO ═══════ */
function calc(){
  const P=D.pagar.filter(inCur), R=D.receber.filter(inCur);
  const saidas=P.reduce((a,b)=>a+ +b.v,0);
  const pago=P.filter(p=>p.s).reduce((a,b)=>a+ +b.v,0);
  const entradas=R.reduce((a,b)=>a+ +b.v,0);
  const receb=R.filter(r=>r.s===2).reduce((a,b)=>a+ +b.v,0)
             +R.filter(r=>r.s===1).reduce((a,b)=>a+ +b.v/2,0);
  const recor=R.filter(r=>r.t==="Recorrente").reduce((a,b)=>a+ +b.v,0);
  const sobra=entradas-saidas;
  const saldo=receb-pago;
  return {saidas,pago,aberto:saidas-pago,entradas,receb,areceber:entradas-receb,
          recor,sobra,saldo,taxa:entradas?Math.round(sobra/entradas*100):0};
}
function fv(P,i,n){ return P*(((1+i)**n-1)/i); }

/* ═══════ VIEWS ═══════ */
const META={painel:["// VISÃO GERAL","Painel <em>do mês</em>"],
 pagar:["// SAÍDAS","Contas <em>a pagar</em>"],receber:["// ENTRADAS","Valores <em>a receber</em>"],
 assinaturas:["// RECORRÊNCIAS","Minhas <em>assinaturas</em>"],
 invest:["// PATRIMÔNIO","Projeção de <em>investimento</em>"],
 metas:["// OBJETIVOS","Metas e <em>reserva</em>"],
 config:["// AJUSTES","Config <em>do app</em>"]};

function painel(){
  const c=calc();
  const pct=c.entradas?Math.max(0,Math.min(100,Math.round(c.saidas/c.entradas*100))):0;
  const hora=new Date().getHours();
  const sauda = hora<12?"Bom dia":hora<18?"Boa tarde":"Boa noite";
  const nome = (D.config.nome||"").trim().split(" ")[0];
  const MES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const cur=D.config.compAtual;
  const abertoAtual=D.pagar.filter(inCur).filter(p=>!p.s).reduce((a,b)=>a+ +b.v,0);
  const projMensal=D.pagar.filter(p=>p.sub && p.ciclo!=="anual" && inCur(p)).reduce((a,b)=>a+ +b.v,0);
  const meses=[];
  for(let i=0;i<6;i++){
    const comp=compMais(cur,i);
    const mi=(+comp.split("-")[1])-1;
    const tot = i===0 ? abertoAtual : projMensal;
    meses.push({comp,label:MES[mi].slice(0,3),tot,atual:i===0});
  }
  const maxMes=Math.max(...meses.map(x=>x.tot),1);

  let h=`<div class="saud">
    <div class="s1">${sauda}${nome?`, ${nome}`:""}</div>
    <div class="s2">Aqui está o resumo do seu ${(D.config.mes||"mês").toLowerCase()}.</div>
   </div>
   <div class="kpis">
   <div class="kpi"><div class="k">Entradas</div><div class="v">${BRL(c.entradas)}</div><div class="s">${D.receber.filter(inCur).length} lançamentos</div></div>
   <div class="kpi"><div class="k">Saídas</div><div class="v">${BRL(c.saidas)}</div><div class="s">${D.pagar.filter(inCur).length} lançamentos</div></div>
   <div class="kpi"><div class="k">Sobra</div><div class="v ${c.sobra>=0?'g':'rd'}">${BRL(c.sobra)}</div><div class="s">${c.sobra>=0?'vai para investimento':'atenção: negativo'}</div></div>
   <div class="kpi"><div class="k">Taxa de poupança</div><div class="v ${c.taxa>=30?'gr':'rd'}">${c.taxa}%</div><div class="s">meta: acima de 30%</div></div>
  </div>
  <div class="fatura">
   <div class="fatx"><div class="fk2">FATURA DE ${(D.config.mes||'').toUpperCase()}</div>
    <div class="fv2">${BRL(c.aberto)} <span>em aberto</span></div></div>
   <button class="btn g" onclick="fecharFatura()">Finalizar mês →</button>
  </div>
  <div class="lab">Em aberto por mês</div>
  <div class="card mesescard">
   <div class="mesesbar">
    ${meses.map((x,idx)=>`<div class="mescol ${x.atual?'on':''}" onclick="verMes(${idx})">
      <div class="mesv">${BRL(x.tot).replace('R$ ','')}</div>
      <div class="mesbar"><span style="height:${Math.round(x.tot/maxMes*100)}%"></span></div>
      <div class="mesk">${x.label}</div>
    </div>`).join("")}
   </div>
   <div class="mesnota">Toque em um mês para ver as contas.</div>
  </div>
  <div class="lab">Proporção</div>
  <div class="split"><div style="flex:${pct};background:var(--paper2);color:var(--gray);">${pct}% SAÍDAS</div>
   <div style="flex:${100-pct};background:var(--gold);color:var(--paper);">${100-pct}% SOBRA</div></div>
  <div class="lab">Situação do mês</div><div class="card">
   <div class="tr"><div class="nm"><div class="t1">Contas já pagas</div><div class="t2">${D.pagar.filter(inCur).filter(p=>p.s).length} de ${D.pagar.filter(inCur).length}</div></div><div class="vl" style="color:var(--green)">${BRL(c.pago)}</div></div>
   <div class="tr"><div class="nm"><div class="t1">Contas em aberto</div><div class="t2">vencem neste mês</div></div><div class="vl" style="color:var(--red)">${BRL(c.aberto)}</div></div>
   <div class="tr"><div class="nm"><div class="t1">Já recebido</div><div class="t2">inclui parciais</div></div><div class="vl" style="color:var(--green)">${BRL(c.receb)}</div></div>
   <div class="tr"><div class="nm"><div class="t1">A receber</div><div class="t2">previsto até o fim do mês</div></div><div class="vl" style="color:var(--red)">${BRL(c.areceber)}</div></div>
   <div class="tr"><div class="nm"><div class="t1">Receita recorrente</div><div class="t2">cobre ${c.saidas?Math.round(c.recor/c.saidas*100):0}% das saídas</div></div><div class="vl" style="color:var(--gold)">${BRL(c.recor)}</div></div>
  </div>
  <div class="lab">Alocação da sobra</div><div class="card">`;
  [["Reserva de emergência",.4],["Investimento longo prazo",.4],["Reserva de oportunidade",.2]].forEach(a=>{
    h+=`<div class="tr"><div class="nm"><div class="t1">${a[0]}</div><div class="t2">${a[1]*100}% da sobra</div></div>
     <div class="vl" style="color:var(--gold)">${BRL(Math.max(0,c.sobra)*a[1])}</div></div>`;});
  h+=`</div>`;
  return h;
}

function exportar(){
  const txt=JSON.stringify(D,null,2);
  const nome="bp-financeiro-"+new Date().toISOString().slice(0,10)+".json";
  try{
    const b=new Blob([txt],{type:"application/json"});
    const u=URL.createObjectURL(b);
    const a=document.createElement("a"); a.href=u; a.download=nome; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),1500);
    toast("Arquivo baixado");
  }catch(e){
    navigator.clipboard?.writeText(txt).then(()=>toast("Copiado"),()=>toast("Falhou"));
  }
}
function importar(){
  const i=document.createElement("input"); i.type="file"; i.accept="application/json,.json";
  i.onchange=()=>{ const f=i.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const o=JSON.parse(r.result);
      if(!o || typeof o!=="object") throw 0;
      D=Object.assign(JSON.parse(JSON.stringify(SEED)),o);
      save(); aplicaModo(); show(view); toast("Dados importados");
    }catch(e){ toast("Arquivo inválido"); } };
    r.readAsText(f); };
  i.click();
}
function zerar(){
  if(!confirm("Apagar todos os lançamentos e metas?\nEssa ação não tem volta."))return;
  DB.limpar().then(()=>{ D=JSON.parse(JSON.stringify(SEED)); D.pagar=[]; D.receber=[]; D.metas=[];
    save(); show(view); toast("Tudo apagado"); });
}

function pagar(){
  const c=calc();
  const lista=D.pagar.filter(inCur);
  let h=`<div class="trio">
   <div class="b"><div class="k">Já pago</div><div class="v" style="color:var(--green)">${BRL(c.pago)}</div></div>
   <div class="b"><div class="k">Em aberto</div><div class="v" style="color:var(--red)">${BRL(c.aberto)}</div></div>
   <div class="b"><div class="k">% da renda</div><div class="v">${c.entradas?Math.round(c.saidas/c.entradas*100):0}%</div></div>
  </div>
  <div class="lab"><span>Lançamentos · ${D.config.mes}</span><button class="btn sm" onclick="abrir('pagar')">+ Nova conta</button></div><div class="card">`;
  if(!lista.length) h+=`<div class="empty">Nenhuma conta em ${D.config.mes}.<br>Toque em <b>+ Nova conta</b> para começar.</div>`;
  lista.slice().sort((a,b)=>(a.d||'').localeCompare(b.d||'')).forEach(p=>{
    h+=`<div class="tr"><div class="dt">${p.d}</div>

let subFiltro="todas";

function assinaturas(){
  const subs=D.pagar.filter(p=>p.sub && inCur(p));
  const mensal=subs.filter(s=>s.ciclo!=="anual");
  const anual=subs.filter(s=>s.ciclo==="anual");
  // custo mensal médio: mensais cheios + anuais/12
  const mediaMes=mensal.reduce((a,b)=>a+ +b.v,0)+anual.reduce((a,b)=>a+ +b.v/12,0);
  const anoTotal=mensal.reduce((a,b)=>a+ +b.v*12,0)+anual.reduce((a,b)=>a+ +b.v,0);
  const pagoMes=subs.filter(s=>s.s).reduce((a,b)=>a+ +b.v,0);
  // próxima cobrança (menor dia >= hoje, senão menor dia)
  const hoje=new Date().getDate();
  const dias=subs.map(s=>+s.d).sort((a,b)=>a-b);
  const prox=dias.find(d=>d>=hoje) ?? dias[0];
  const MES=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"][new Date().getMonth()];
  // paleta rotativa para os cards
  const COR=["#9BC49A","#E7C15B","#C9C3B6","#6E86C4","#A8D08B","#D69A8B","#8BC6D0","#C7A8D0"];
  let lista = subFiltro==="mensais"?mensal : subFiltro==="anuais"?anual : subs;
  lista = lista.slice().sort((a,b)=>(+a.d)-(+b.d));

  let h=`<div class="subchips">
    ${[["todas","Todas"],["mensais","Mensais"],["anuais","Anuais"]].map(([k,l])=>
      `<button class="subchip ${subFiltro===k?'on':''}" onclick="setSubFiltro('${k}')">${l}</button>`).join("")}
   </div>`;

  if(!subs.length){
    return h+`<div class="empty">Nenhuma assinatura ainda.<br>Em <b>Pagar</b>, escolha a forma <b>Assinatura</b> ao criar a conta.</div>`;
  }
  if(!lista.length) h+=`<div class="empty">Nenhuma assinatura ${subFiltro==="anuais"?"anual":"mensal"}.</div>`;

  lista.forEach((s,i)=>{
    const col=COR[D.pagar.filter(p=>p.sub).findIndex(p=>p.id===s.id)%COR.length];
    h+=`<div class="subcard" style="background:${col}" onclick="abrir('pagar','${s.id}')">
      <div class="ico">${(s.n[0]||'?').toUpperCase()}</div>
      <div class="info">
        <div class="t1">${s.n}</div>
        <div class="t2">${BRL(s.v)} · ${s.ciclo||'mensal'}</div>
      </div>
      <div class="cobra">dia ${s.d}</div>
    </div>`;
  });

  h+=`<div class="subresumo">
    <div class="lab2">PAGAS ESTE MÊS</div>
    <div class="big">${BRL(pagoMes)}</div>
    <div class="sub2">${subs.length} assinaturas · ${anual.length} anual${anual.length===1?'':'is'}</div>
   </div>`;

  h+=`<div class="subgasto">
    <div class="lab3">GASTO EM ASSINATURAS</div>
    <div class="grow"><span class="bg">${BRL(mediaMes)}</span><span class="per">/ mês em média</span></div>
    <div class="ano">${BRL(anoTotal)} ao ano</div>
    <div class="faixa">
      <div><div class="fk">MENSAIS</div><div class="fv">${mensal.length}</div></div>
      <div class="fd"></div>
      <div style="text-align:right"><div class="fk">PRÓXIMA</div><div class="fv">${String(prox).padStart(2,'0')} ${MES.toLowerCase()}</div></div>
    </div>
   </div>`;
  return h;
}

function addLog(tipo,txt){
  if(!D.log) D.log=[];
  D.log.unshift({ts:Date.now(),tipo,txt});
  if(D.log.length>120) D.log.length=120;
}
function tsFmt(ts){
  const d=new Date(ts);
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function snapAtual(){
  const c=calc();
  const cur=D.config.compAtual;
  const P=D.pagar.filter(inCur).map(p=>({n:p.n,f:p.f,v:+p.v,s:p.s?1:0,d:p.d||'',sub:p.sub?1:0}));
  const R=D.receber.filter(inCur).map(r=>({n:r.n,t:r.t,v:+r.v,s:r.s,d:r.d||''}));
  return {
    id:uid(), comp:cur, mes:monthName(cur), ano:+cur.split("-")[0], ts:Date.now(),
    entradas:c.entradas, saidas:c.saidas, pago:c.pago, aberto:c.aberto,
    receb:c.receb, sobra:c.sobra, saldo:c.saldo,
    nPagar:P.length, nReceber:R.length,
    metaTotal:D.metas.reduce((s,m)=>s+ +m.a,0),
    itens:{pagar:P, receber:R}
  };
}
function fecharMes(){
  if(!D.hist) D.hist=[];
  const snap=snapAtual();
  const i=D.hist.findIndex(x=>x.comp===snap.comp);
  if(i>=0) D.hist[i]=snap; else D.hist.unshift(snap);
  D.hist.sort((a,b)=>b.ts-a.ts);
  addLog("fechou",`Fechou ${snap.mes}/${snap.ano} · saldo ${BRL(snap.saldo)}`);
  save(); show('config'); toast("Mês salvo no histórico");
}
function fecharFatura(){
  if(!D.hist) D.hist=[];
  const cur=D.config.compAtual;
  const nxt=nextComp(cur);
  // 1) snapshot da fatura atual
  const snap=snapAtual();
  const i=D.hist.findIndex(x=>x.comp===cur);
  if(i>=0) D.hist[i]=snap; else D.hist.unshift(snap);
  D.hist.sort((a,b)=>b.ts-a.ts);
  // 2) virar contas (estilo fatura de cartão)
  const outros=D.pagar.filter(p=>(p.comp||cur)!==cur); // meses já existentes ficam
  const doMes=D.pagar.filter(p=>(p.comp||cur)===cur);
  const novos=[];
  doMes.forEach(p=>{
    if(p.sub){
      // assinatura mensal reaparece no próximo mês; anual reaparece daqui a 12 meses
      const alvo = p.ciclo==="anual" ? compMais(cur,12) : nxt;
      novos.push({...p, id:uid(), comp:alvo, dt:shiftDt(p.dt,alvo,p.d), s:0});
      // instância atual: arquivada no histórico (some do ativo)
    } else if(p.inv){
      // aporte reaparece no próximo mês em aberto
      novos.push({...p, id:uid(), comp:nxt, dt:shiftDt(p.dt,nxt,p.d), s:0});
    } else {
      // conta avulsa: paga → arquiva; em aberto → vira pro próximo mês (saldo rotativo)
      if(!p.s) novos.push({...p, comp:nxt, dt:shiftDt(p.dt,nxt,p.d)});
    }
  });
  D.pagar=outros.concat(novos);
  // recebíveis: recorrentes reaparecem; avulsos recebidos arquivam; a receber viram
  const outrosR=D.receber.filter(r=>(r.comp||cur)!==cur);
  const doMesR=D.receber.filter(r=>(r.comp||cur)===cur);
  const novosR=[];
  doMesR.forEach(r=>{
    if(r.t==="Recorrente"){ novosR.push({...r, id:uid(), comp:nxt, dt:shiftDt(r.dt,nxt,r.d), s:0}); }
    else { if(r.s!==2) novosR.push({...r, comp:nxt, dt:shiftDt(r.dt,nxt,r.d)}); }
  });
  D.receber=outrosR.concat(novosR);
  // 3) avança o mês
  D.config.compAtual=nxt;
  D.config.mes=monthName(nxt);
  addLog("fechou",`Fechou ${snap.mes} → abriu ${monthName(nxt)} · saldo ${BRL(snap.saldo)}`);
  save(); show('painel'); toast(`Fatura de ${snap.mes} fechada`);
}

function invest(){
  const ap=+D.config.aporte, tx=+D.config.taxa/100;
  const m36=fv(ap,tx,36);
  // aportes reais lançados como conta de Investimento
  const aportesInv=D.pagar.filter(p=>p.inv);
  const aporteRealMes=aportesInv.reduce((a,b)=>a+ +b.v,0);
  const aportadoMeta=D.metas.reduce((s,m)=>s+ +m.a,0);
  let h=`<div class="lab"><span>Parâmetros</span><button class="btn sm" onclick="abrir('params')">Ajustar</button></div>
  <div class="kpis">
   <div class="kpi"><div class="k">Aporte mensal</div><div class="v">${BRL(ap)}</div><div class="s">todo mês</div></div>
   <div class="kpi"><div class="k">Rentabilidade</div><div class="v">${String(D.config.taxa).replace(".",",")}%<span style="font-size:13px;color:var(--gray)"> a.m.</span></div><div class="s">~${(((1+tx)**12-1)*100).toFixed(1).replace(".",",")}% ao ano</div></div>
   <div class="kpi"><div class="k">Em 36 meses</div><div class="v g">${BRL(m36)}</div><div class="s">aportado ${BRL(ap*36)}</div></div>
   <div class="kpi"><div class="k">Juros no período</div><div class="v gr">${BRL(m36-ap*36)}</div><div class="s">o dinheiro trabalhando</div></div>
  </div>`;
  if(aportesInv.length){
    const difere=Math.abs(aporteRealMes-ap)>0.005;
    h+=`<div class="lab">Aportes lançados</div><div class="card">
     <div class="tr"><div class="nm"><div class="t1">Total em aportes/mês</div><div class="t2">${aportesInv.length} lançamento${aportesInv.length>1?'s':''} de investimento</div></div>
      <div class="vl" style="color:var(--gold)">${BRL(aporteRealMes)}</div></div>
     <div class="tr"><div class="nm"><div class="t1">Já acumulado em metas</div><div class="t2">soma do guardado nas metas</div></div>
      <div class="vl" style="color:var(--green)">${BRL(aportadoMeta)}</div></div>
     ${difere?`<button class="btn g full" style="margin-top:8px;" onclick="usarAporteReal(${aporteRealMes})">Usar R$ ${aporteRealMes.toLocaleString("pt-BR",{minimumFractionDigits:2})} como aporte mensal</button>`:''}
    </div>`;
  }
  h+=`<div class="lab">Evolução do montante</div><div class="card">`;
  [6,12,18,24,36,48,60].forEach(n=>{
    const v=fv(ap,tx,n), j=v-ap*n;
    h+=`<div class="tr"><div class="nm"><div class="t1">${n} meses</div><div class="t2">aportado ${BRL(ap*n)}</div></div>
     <div style="text-align:right;flex:0 0 auto;"><div class="vl">${BRL(v)}</div>
      <div class="t2" style="color:var(--green);margin-top:3px;">+${BRL(j)}</div></div></div>`;});
  h+=`</div><div class="lab">Cenários de aporte — 36 meses</div><div class="card">`;
  const cen=[1000,1500,2000,2500,3000];
  if(!cen.includes(ap)) cen.push(ap);
  cen.sort((a,b)=>a-b);
  const max=fv(Math.max(...cen),tx,36);
  cen.forEach(p=>{ const v=fv(p,tx,36);
    h+=`<div class="bar${p===ap?' on':''}"><div class="a">${BRL(p)}</div>
     <div class="t"><div class="f" style="width:${v/max*100}%"></div></div>

      di.textContent=`${n} registros · ${kb} KB · ${md}`;

function tog(tp,id){
  const it=D[tp].find(x=>x.id===id); if(!it)return;
  const antes=it.s;
  it.s = tp==="pagar" ? (it.s?0:1) : (it.s+1)%3;
  // aporte automático: ao marcar como PAGO (0->1) um lançamento de Investimento, credita na meta
  if(tp==="pagar" && it.inv && it.meta && antes===0 && it.s===1){
    const m=D.metas.find(x=>x.id===it.meta);
    if(m){ m.a=(+m.a||0)+ +it.v; toast(`Aportado em ${m.n}`); }
  }
  if(tp==="pagar" && it.inv && it.meta && antes===1 && it.s===0){
    const m=D.metas.find(x=>x.id===it.meta);
    if(m){ m.a=Math.max(0,(+m.a||0)- +it.v); }
  }
  if(tp==="pagar") addLog(it.s?"pago":"aberto",`${it.s?'Pagou':'Reabriu'} ${it.n} · ${BRL(it.v)}`);
  else addLog("receber",`${it.n} → ${["aberto","parcial","recebido"][it.s]} · ${BRL(it.v)}`);
  save(); show(view);
}
function cfForma(){
  const v=document.getElementById('i_f').value;
  const sc=document.getElementById('subciclo'); if(sc) sc.style.display=v==='Assinatura'?'block':'none';
  const im=document.getElementById('invmeta'); if(im) im.style.display=v==='Investimento'?'block':'none';
}
function del(tp,id){
  const k = tp==="meta"?"metas":tp;
  // se for uma conta de investimento JÁ PAGA, estorna o aporte da meta antes de excluir
  if(tp==="pagar"){
    const it=D.pagar.find(x=>x.id===id);
    if(it && it.inv && it.meta && it.s){
      const m=D.metas.find(x=>x.id===it.meta);
      if(m){ m.a=Math.max(0,(+m.a||0)- +it.v); }
    }
  }
  const alvo=D[k].find(x=>x.id===id);
  if(alvo) addLog("excluiu",`Excluiu ${alvo.n||'item'}${alvo.v?` · ${BRL(alvo.v)}`:''}`);
  D[k]=D[k].filter(x=>x.id!==id);
  save(); closeSheet(); show(view); toast("Removido");
}

     <div class="duo">
      <div class="f"><label>Tipo</label><select id="i_t">
       ${["Projeto","Recorrente"].map(o=>`<option ${it&&it.t===o?'selected':''}>${o}</option>`).join("")}</select></div>
      <div class="f"><label>Condição</label><input id="i_f" value="${it?it.f:''}"></div></div>`;
  } else if(tp==="meta"){
    titulo=it?"Editar <em>meta</em>":"Nova <em>meta</em>"; sub="Quanto quer juntar e quanto já tem.";
    h=`<div class="f"><label>Nome da meta</label><input id="i_n" value="${it?it.n:''}"></div>
     <div class="f"><label>Descrição</label><input id="i_d2" value="${it?it.d:''}"></div>
     <div class="duo">
      <div class="f"><label>Valor da meta</label><input id="i_m" inputmode="decimal" value="${it?it.m:''}"></div>
      <div class="f"><label>Já guardado</label><input id="i_a" inputmode="decimal" value="${it?it.a:''}"></div></div>`;

function verConta(id,idx){
  const p=D.pagar.find(x=>x.id===id); if(!p) return;
  const paga=!!p.s;
  const dataStr = p.dt ? (()=>{ const d=new Date(p.dt+"T00:00:00"); return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`; })() : `dia ${p.d||'—'}`;
  let h=`<div class="sd">Detalhes desta conta.</div>
   <div class="card" style="margin-top:8px;">
    <div class="tr"><div class="nm"><div class="t1">Descrição</div><div class="t2">forma & recorrência</div></div>
     <div style="text-align:right;flex:0 0 auto;"><div class="vl">${p.n}</div>
      <div class="t2" style="margin-top:4px;">${p.f}${p.sub?' · '+(p.ciclo||'mensal'):''}${p.inv?' · aporte':''}</div></div></div>
    <div class="tr"><div class="nm"><div class="t1">Valor</div><div class="t2">total desta cobrança</div></div>
     <div class="vl" style="color:var(--gold);font-size:20px;">${BRL(p.v)}</div></div>
    <div class="tr"><div class="nm"><div class="t1">Vencimento</div><div class="t2">data cadastrada</div></div>
     <div class="vl">${dataStr}</div></div>
    <div class="tr"><div class="nm"><div class="t1">Situação</div><div class="t2">${paga?'já quitada':'em aberto'}</div></div>
     <div class="vl" style="color:${paga?'var(--green)':'var(--red)'}">${paga?'PAGA':'ABERTA'}</div></div>
   </div>
   <button class="btn ${paga?'':'g'} full" style="margin-top:12px;" onclick="togMes('${p.id}',${idx})">${paga?'Marcar como aberta':'Marcar como paga'}</button>
   <button class="btn full" style="margin-top:8px;" onclick="verMes(${idx})">Voltar ao mês</button>`;

function togMes(id,idx){
  tog('pagar',id);
  verMes(idx);
}

function openSheet(){
  const sh=$('sheet'); sh.classList.add('show');
  // força reflow pra transição rodar
  void sh.offsetWidth;
  sh.classList.add('on');
}
function closeSheet(){
  const sh=$('sheet');
  sh.classList.remove('on');
  setTimeout(()=>{ if(!sh.classList.contains('on')) sh.classList.remove('show'); }, 420);
}
$('sheet').onclick=e=>{ if(e.target.id==='sheet') closeSheet(); };

function verMes(idx){
  const targetComp=compMais(D.config.compAtual,idx);
  const ano=+targetComp.split("-")[0];
  const nome=monthName(targetComp);
  const atual=(idx===0);

  const real=D.pagar.filter(p=>(p.comp||D.config.compAtual)===targetComp);
  const realR=D.receber.filter(r=>(r.comp||D.config.compAtual)===targetComp);
  let pagar, receber, projetado=false;
  if(real.length||realR.length){
    pagar=real.slice(); receber=realR.slice();
  } else {
    // projeção: assinaturas mensais do mês atual reaparecem
    projetado=true;
    pagar=D.pagar.filter(p=>p.sub && p.ciclo!=="anual" && inCur(p)).map(p=>({...p,s:0}));
    receber=D.receber.filter(r=>r.t==="Recorrente" && inCur(r)).map(r=>({...r,s:0}));
  }
  pagar=pagar.sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  receber=receber.sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  const saidas=pagar.reduce((a,b)=>a+ +b.v,0);
  const entradas=receber.reduce((a,b)=>a+ +b.v,0);
  const pago=pagar.filter(p=>p.s).reduce((a,b)=>a+ +b.v,0);
  const aberto=saidas-pago;
  const sobra=entradas-saidas;
  const pct=entradas?Math.max(0,Math.min(100,Math.round(saidas/entradas*100))):0;

  let h=`<div class="sd">${atual?'Mês atual · contas desta fatura.':(projetado?'Previsão · assinaturas que se repetem.':'Contas deste mês.')}</div>
   <div class="kpis" style="margin-top:8px;">
    <div class="kpi"><div class="k">Saídas totais</div><div class="v">${BRL(saidas)}</div><div class="s">${pagar.length} lançamentos</div></div>
    <div class="kpi"><div class="k">Já pago</div><div class="v g">${BRL(pago)}</div><div class="s">${pagar.filter(p=>p.s).length} contas</div></div>
    <div class="kpi"><div class="k">Em aberto</div><div class="v rd">${BRL(aberto)}</div><div class="s">${pagar.filter(p=>!p.s).length} contas</div></div>
    <div class="kpi"><div class="k">Sobra</div><div class="v ${sobra>=0?'g':'rd'}">${BRL(sobra)}</div><div class="s">entradas − saídas</div></div>
   </div>
   <div class="split" style="margin-top:8px;">
    <div style="flex:${pct};background:var(--paper2);color:var(--gray);">${pct}% SAÍDAS</div>
    <div style="flex:${100-pct};background:var(--gold);color:var(--paper);">${100-pct}% SOBRA</div>
   </div>
   <div class="lab">${projetado?'Contas previstas':'Contas'}</div>
   <div class="card">`;
  if(!pagar.length) h+=`<div class="empty">Sem contas.</div>`;
  pagar.forEach(p=>{
    const clic = (atual||!projetado);
    h+=`<div class="tr" ${clic?`onclick="verConta('${p.id}',${idx})" style="cursor:pointer;"`:''}>
     <div class="nm"><div class="t1">${p.n}</div><div class="t2">${p.f}${p.sub?' · '+(p.ciclo||'mensal'):''} · dia ${p.d||'—'}</div>
      ${clic?`<div style="margin-top:5px;"><button class="st ${p.s?'ok':'no'}" onclick="event.stopPropagation();togMes('${p.id}',${idx})">${p.s?'PAGO':'ABERTO'}</button></div>`:`<div style="margin-top:5px;"><span class="st no" style="opacity:.6">PREVISTA</span></div>`}</div>
     <div class="vl">${BRL(p.v)}</div></div>`;
  });
  h+=`<div class="tot"><span class="l">Total de ${nome}</span><span class="v">${BRL(saidas)}</span></div></div>`;
  if(receber.length){
    h+=`<div class="lab">Recebíveis</div><div class="card">`;
    receber.forEach(p=>{
      h+=`<div class="tr">
       <div class="nm"><div class="t1">${p.n}</div><div class="t2">${p.t||''}${p.f?' · '+p.f:''} · dia ${p.d||'—'}</div></div>
       <div class="vl">${BRL(p.v)}</div></div>`;
    });
    h+=`<div class="tot"><span class="l">Total previsto</span><span class="v">${BRL(entradas)}</span></div></div>`;
  }
  h+=`<button class="btn full" style="margin-top:12px;" onclick="closeSheet()">Fechar</button>`;
  $('sbody').innerHTML=`<h3>${nome} <em>${ano}${atual?' · atual':''}</em></h3>${h}`;
  openSheet();
}

function salvar(tp,id){
  const g=i=>{const e=$(i);return e?e.value.trim():"";};
  if(tp==="params"){
    D.config.aporte=+g('c_ap')||0; D.config.taxa=parseFloat(g('c_tx').replace(",","."))||0;
    D.config.mes=g('c_ms')||D.config.mes;
  } else if(tp==="meta"){
    const o={n:g('i_n')||"Meta",d:g('i_d2'),m:+g('i_m')||0,a:+g('i_a')||0};
    if(id){Object.assign(D.metas.find(x=>x.id===id),o);} else {D.metas.push({id:uid(),...o});}
    addLog(id?"editou":"criou",`${id?'Editou':'Criou'} meta: ${o.n}`);
  } else {
    const v=parseMoney(g('i_v'));
    const isSub=g('i_f')==='Assinatura';
    const isInv=g('i_f')==='Investimento';
    let dt=g('i_dt')||"";
    const nome=g('i_n');
    if(!nome){ toast("Informe a descrição"); return; }
    if(!(v>0)){ toast("Informe um valor válido"); return; }
    if(!dt){ toast("Selecione a data"); return; }
    if(isInv && !g('i_meta')){ toast("Escolha a meta do aporte"); return; }
    // conta pertence à fatura atual: normaliza a data para o mês em aberto
    const compNew = id ? (D[tp].find(x=>x.id===id)?.comp||D.config.compAtual) : D.config.compAtual;
    const dia = dt.slice(8,10);
    dt = compNew+"-"+dia;
    const o = tp==="pagar"
      ? {d:dia,dt,comp:compNew,n:nome,f:g('i_f'),v,
         sub:isSub?1:0,ciclo:isSub?(g('i_ciclo')||"mensal"):"",
         inv:isInv?1:0,meta:isInv?g('i_meta'):""}
      : {d:dia,dt,comp:compNew,n:nome,t:g('i_t'),f:g('i_f'),v};
    if(id){
      const prev=D[tp].find(x=>x.id===id);
      // se estava paga e era aporte, reverte o efeito anterior na meta
      if(tp==="pagar" && prev && prev.s && prev.inv && prev.meta){
        const mp=D.metas.find(x=>x.id===prev.meta);
        if(mp){ mp.a=Math.max(0,(+mp.a||0)- +prev.v); }
      }
      Object.assign(prev,o);
      // reaplica com os novos dados se continua paga e é aporte
      if(tp==="pagar" && prev.s && o.inv && o.meta){
        const mn=D.metas.find(x=>x.id===o.meta);
        if(mn){ mn.a=(+mn.a||0)+ +o.v; }
      }
    }
    else {D[tp].push({id:uid(),...o,s:0});}
    const rot={pagar:"conta",receber:"recebível"}[tp]||tp;
    addLog(id?"editou":"criou",`${id?'Editou':'Criou'} ${rot}: ${nome} · ${BRL(v)}`);
  }
  save(); closeSheet(); show(view); toast(id?"Atualizado":"Adicionado");
}
/* ═══════ SUPABASE ═══════ */
const SUPA_URL="https://YOUR-PROJECT.supabase.co";
const SUPA_KEY="YOUR-ANON-KEY";
let supa=null;
async function initSupa(){
  if(supa) return supa;
  try{
    const m=await import("https://esm.sh/@supabase/supabase-js@2");
    supa=m.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false}});
  }catch(e){ console.warn("supabase off",e); }
  return supa;
}
async function sha256(s){
  const buf=new TextEncoder().encode(s);
  const h=await crypto.subtle.digest("SHA-256",buf);
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
const SESS_KEY="bp_sess";
function getSess(){ return {owner_id:"teste",nome:"Teste",email:"teste@local"}; }
function setSess(s){ localStorage.setItem(SESS_KEY,JSON.stringify(s)); }
function clearSess(){ localStorage.removeItem(SESS_KEY); }

async function fazerCadastro(){
  const msg=$('au_msg'); msg.textContent="";
  const nome=$('au_nome').value.trim();
  const email=$('au_email').value.trim().toLowerCase();
  const cpf=String($('au_cpf').value||"").replace(/\D/g,"");
  const pw=$('au_pw2').value;
  if(!nome||!email||cpf.length!==11||pw.length<6){ msg.textContent="Preencha tudo. Senha ≥ 6."; return; }
  await initSupa();
  if(!supa){ msg.textContent="Supabase offline. Verifique URL/KEY."; return; }
  const owner_id=await sha256(email+"|"+cpf);
  const pw_hash=await sha256(owner_id+":"+pw);
  const {data:ex}=await supa.from("bp_users").select("owner_id").or(`email.eq.${email},cpf.eq.${cpf}`).limit(1);
  if(ex && ex.length){ msg.textContent="Email ou CPF já cadastrado."; return; }
  const {error}=await supa.from("bp_users").insert({owner_id,nome,email,cpf,pw_hash});
  if(error){ msg.textContent="Erro: "+error.message; return; }
  const seed=JSON.parse(JSON.stringify(SEED)); seed.config.nome=nome; seed.config.cpf=cpf;
  seed.pagar=[]; seed.receber=[]; seed.metas=[];
  await supa.from("bp_data").insert({owner_id,data:seed});
  setSess({owner_id,nome,email});
  $('auth').style.display="none";
  await load();
}
async function fazerLogin(){
  const msg=$('au_msg'); msg.textContent="";
  const idv=$('au_id').value.trim();
  const pw=$('au_pw').value;
  if(!idv||!pw){ msg.textContent="Preencha email/CPF e senha."; return; }
  await initSupa();
  if(!supa){ msg.textContent="Supabase offline."; return; }
  const isEmail=idv.includes("@");
  const q=isEmail?{email:idv.toLowerCase()}:{cpf:idv.replace(/\D/g,"")};
  const {data,error}=await supa.from("bp_users").select("owner_id,nome,email,cpf,pw_hash").match(q).limit(1);
  if(error||!data||!data.length){ msg.textContent="Conta não encontrada."; return; }
  const u=data[0];
  const pw_hash=await sha256(u.owner_id+":"+pw);
  if(pw_hash!==u.pw_hash){ msg.textContent="Senha incorreta."; return; }
  setSess({owner_id:u.owner_id,nome:u.nome,email:u.email});
  $('auth').style.display="none";
  await load();
}
function switchAuth(k){
  $('ab1').classList.toggle('on',k==='login'); $('ab2').classList.toggle('on',k==='cad');
  $('au_login').style.display=k==='login'?'block':'none';
  $('au_cad').style.display=k==='cad'?'block':'none';
  $('au_msg').textContent="";
}
async function logout(){ clearSess(); location.reload(); }
